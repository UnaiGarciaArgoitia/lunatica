function prepararSprites(){ if (SPR.listo) return; SPR.brillo = spriteBrillo(); SPR.nube = spriteNube(); SPR.nebulosa = spriteNebulosa(); SPR.luna = spriteLuna(); SPR.tierra = spriteTierra(1024); SPR.listo = true; }

const Escena = {
  cv:null, ctx:null, w:0, h:0, dpr:1, rivales:[], visRiv:{}, cam:0, obj:0, t:0, ult:0, raf:0, modo:"vuelo", parts:[], ondas:[], fugaces:[], viaje:null, vel:0, sacudida:0,
  est: Array.from({length:220},(_,i)=>({x:Math.random(), y:Math.random(), z:[.2,.45,1][i%3], r:.4+Math.random()*1.2, f:Math.random()*6.3, col:["#ffffff","#cfe0ff","#fff1d6","#ffd6e8"][i%4]})),
  nubes: Array.from({length:6},(_,i)=>({alt:12 + i*5 + Math.random()*3, x:Math.random(), s:.6 + Math.random()*.8, v:(Math.random()-.5)*.01, delante: i%3===0})),
  conectar(cv, op={}){
    prepararSprites();
    this.cv = cv; this.ctx = cv.getContext("2d"); this.modo = op.modo || "vuelo";
    if (op.alt !== undefined){ this.cam = op.desde ?? op.alt; this.obj = op.alt; }
    this.viaje = op.viaje || null; this.t0 = performance.now(); this.parts = []; this.ondas = [];
    if (!this.raf){ this.ult = performance.now(); this.raf = requestAnimationFrame(this.bucle); }
  },
  subir(a){ this.obj = Math.min(LUNA, a); this.sacudida = .5; },
  rafaga(color, n=50){
    if (reduceMov) return; const c = this.cohetePos();
    this.ondas.push({x:c.x, y:c.y, r:10, a:1, col:color});
    for (let i=0;i<n;i++){ const a = Math.random()*Math.PI*2, v = 80+Math.random()*220; this.parts.push({x:c.x, y:c.y-10, vx:Math.cos(a)*v, vy:Math.sin(a)*v, v:0, max:.9+Math.random()*.8, col:color, tam:1.5+Math.random()*2.5, tipo:"chispa"}); }
  },
  cohetePos(){ return {x:this.w/2 + Math.sin(this.t*1.3)*4, y:this.h*.62 + Math.sin(this.t*2.1)*3}; },
  bucle: (ahora) => {
    const E = Escena;
    if (!E.cv || !document.body.contains(E.cv)){ E.raf = 0; E.cv = null; return; }
    if (document.hidden){ E.ult = ahora; E.raf = requestAnimationFrame(E.bucle); return; }
    const dt = Math.min(.05, (ahora - E.ult)/1000); E.ult = ahora; E.t += dt;
    const cw = E.cv.clientWidth, ch = E.cv.clientHeight, dpr = Math.min(2, devicePixelRatio || 1);
    if (cw !== E.w || ch !== E.h || dpr !== E.dpr){ E.w = cw; E.h = ch; E.dpr = dpr; E.cv.width = cw*dpr; E.cv.height = ch*dpr; }
    const prev = E.cam;
    E.cam = reduceMov ? E.obj : E.cam + (E.obj - E.cam) * Math.min(1, dt*1.5);
    if (Math.abs(E.obj-E.cam) < .05) E.cam = E.obj;
    E.vel = (E.cam - prev) / Math.max(dt, .001);
    E.sacudida = Math.max(0, E.sacudida - dt*.8);
    const ctx = E.ctx; ctx.setTransform(dpr,0,0,dpr,0,0);
    if (E.modo === "viaje") E.dibujaViaje(ctx, dt, ahora); else E.dibujaVuelo(ctx, dt);
    E.raf = requestAnimationFrame(E.bucle);
  },
  cielo(ctx, k){
    const g = ctx.createLinearGradient(0,0,0,this.h);
    const mez = (a,b) => a.map((v,i)=>Math.round(v+(b[i]-v)*k));
    g.addColorStop(0,`rgb(${mez([28,62,122],[5,7,18])})`); g.addColorStop(.6,`rgb(${mez([58,112,178],[9,13,30])})`); g.addColorStop(1,`rgb(${mez([120,168,220],[14,20,42])})`);
    ctx.fillStyle = g; ctx.fillRect(0,0,this.w,this.h);
  },
  nebulosa(ctx, desp, alfa){
    if (alfa <= .01) return; const n = SPR.nebulosa, esc = this.w/512, alto = 1024*esc, y = ((desp*.15) % alto + alto) % alto;
    ctx.globalAlpha = alfa; ctx.drawImage(n, 0, y-alto, this.w, alto); ctx.drawImage(n, 0, y, this.w, alto); ctx.globalAlpha = 1;
  },
  estrellas(ctx, desp, alfaBase){
    ctx.globalCompositeOperation = "lighter";
    for (const s of this.est){
      const y = ((s.y*this.h + desp*s.z) % this.h + this.h) % this.h;
      const a = alfaBase * (.5 + .5*Math.sin(this.t*(1.5+s.z) + s.f)) * (.4 + s.z*.6);
      if (a <= .03) continue;
      const tam = s.r * (s.z===1 ? 6 : 4);
      ctx.globalAlpha = a; ctx.drawImage(SPR.brillo, s.x*this.w - tam, y - tam, tam*2, tam*2);
      if (s.z===1 && s.r > 1.2){ ctx.globalAlpha = a*.5; ctx.fillStyle = s.col; ctx.fillRect(s.x*this.w - tam*1.6, y-.5, tam*3.2, 1); ctx.fillRect(s.x*this.w-.5, y - tam*1.6, 1, tam*3.2); }
      if (this.vel > 30 && s.z===1 && !reduceMov){ const L = Math.min(70, this.vel*.18); const g = ctx.createLinearGradient(0,y-L,0,y); g.addColorStop(0,"rgba(255,255,255,0)"); g.addColorStop(1,"rgba(255,255,255,.6)"); ctx.globalAlpha = a; ctx.fillStyle = g; ctx.fillRect(s.x*this.w-.6, y-L, 1.2, L); }
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
  },
  estrellasFugaces(ctx, dt, k){
    if (reduceMov || k < .5) return;
    if (Math.random() < dt*.25) this.fugaces.push({x:Math.random()*this.w, y:Math.random()*this.h*.4, vx:-(250+Math.random()*200), vy:120+Math.random()*80, v:0});
    ctx.globalCompositeOperation = "lighter";
    for (const f of this.fugaces){ f.v += dt; f.x += f.vx*dt; f.y += f.vy*dt; const a = Math.max(0, 1 - f.v/1.1);
      const g = ctx.createLinearGradient(f.x, f.y, f.x - f.vx*.18, f.y - f.vy*.18); g.addColorStop(0,`rgba(255,255,255,${a})`); g.addColorStop(1,"rgba(255,255,255,0)");

  },
  tierra(ctx, ySuelo){
    const R = Math.max(this.w*1.4, 820), cx = this.w/2, cy = ySuelo + R;
    if (ySuelo > this.h + 60) return;
    ctx.globalCompositeOperation = "lighter";
    const halo = ctx.createRadialGradient(cx, cy, R*.985, cx, cy, R*1.09); halo.addColorStop(0,"rgba(110,180,255,.75)"); halo.addColorStop(.35,"rgba(110,180,255,.25)"); halo.addColorStop(1,"rgba(110,180,255,0)");
    ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(cx,cy,R*1.09,0,6.3); ctx.fill();
    ctx.globalCompositeOperation = "source-over";
    ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,R,0,6.3); ctx.clip();
    ctx.translate(cx, cy); ctx.rotate(this.t*.004);
    ctx.drawImage(SPR.tierra, -R, -R, R*2, R*2);
    ctx.restore();
    const borde = ctx.createLinearGradient(0, ySuelo, 0, ySuelo+40); borde.addColorStop(0,"rgba(190,225,255,.25)"); borde.addColorStop(1,"rgba(190,225,255,0)");
    ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,R,0,6.3); ctx.clip(); ctx.fillStyle = borde; ctx.fillRect(0, ySuelo, this.w, 40); ctx.restore();
  },
  luna(ctx, cx, cy, r){
    if (r <= 0 || cy - r > this.h) return;
    ctx.globalCompositeOperation = "lighter";
    const glow = ctx.createRadialGradient(cx,cy,r*.9,cx,cy,r*2); glow.addColorStop(0,"rgba(242,233,201,.35)"); glow.addColorStop(1,"rgba(242,233,201,0)");
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(cx,cy,r*2,0,6.3); ctx.fill();

/* ---------- MODO ONLINE: base de datos compartida entre jugadores ---------- */
const ONLINE = {db:null, user:null, uid:null, jugadores:new Map(), nombres:{}, listo:false, estado:"conectando", guardando:false};
let refrescoOnline = null;
function estadoOnline(){
  const el = document.getElementById("online"); if (!el) return;
  const n = ONLINE.jugadores.size;
  el.className = "online " + ONLINE.estado;
  el.textContent = ONLINE.estado === "si" ? `En línea · ${n} ${n===1?"jugador":"jugadores"}` : ONLINE.estado === "conectando" ? "Conectando…" : (window.mqtt || window.Peer) && !window.claude ? "Duelos online" : "Modo local";
  el.title = ONLINE.estado === "si" ? "Tus resultados se comparten con el resto de jugadores" : "Tus resultados se guardan solo en este navegador";
}
async function nombres(ids){
  const faltan = ids.filter(id => !(id in ONLINE.nombres));
  if (faltan.length && ONLINE.user && ONLINE.user.profiles){
    try { const ps = await ONLINE.user.profiles(faltan); for (const id of faltan) ONLINE.nombres[id] = (ps && ps[id] && ps[id].name) || ""; } catch(e) {}
  }
  return ids.map(id => id === ONLINE.uid ? "Tú" : (ONLINE.nombres[id] || "Astronauta " + id.slice(-4)));
}
(async () => {
  if (!window.claude || !window.claude.use){ ONLINE.estado = "no"; estadoOnline(); return; }
  const espera = setTimeout(() => { if (!ONLINE.listo){ ONLINE.estado = "no"; estadoOnline(); } }, 10000);
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db){ clearTimeout(espera); ONLINE.estado = "no"; estadoOnline(); return; }
    ONLINE.db = db; ONLINE.user = user;
    try { ONLINE.uid = user ? await user.id() : null; } catch(e) {}
    db.collection("jugadas").onSnapshot(snap => {
      ONLINE.jugadores = new Map(snap.docs.filter(d=>d.exists).map(d => [d.id, d.data()]));
      if (!snap.metadata.fromCache){ ONLINE.listo = true; clearTimeout(espera); }
      ONLINE.estado = "si"; estadoOnline();
      if (refrescoOnline) refrescoOnline();
    }, () => { clearTimeout(espera); ONLINE.estado = "no"; estadoOnline(); });
  } catch(e){ clearTimeout(espera); ONLINE.estado = "no"; estadoOnline(); }
})();
async function subirOnline(cambio){
  if (!ONLINE.db || !ONLINE.uid || ONLINE.guardando) return;
  const previo = ONLINE.jugadores.get(ONLINE.uid) || {};
  const nuevo = JSON.parse(JSON.stringify({retos: previo.retos || {}, estudio: previo.estudio || {}}));
  cambio(nuevo); nuevo.actualizado = new Date().toISOString();
  ONLINE.guardando = true;

const PERFIL = {cli:null, lista:new Map(), cbs:new Set(), estado:"no", tPub:null};
const TEMA_PERFILES = "lunatica/v2/perfiles/";

  const s = d.s && typeof d.s === "object" ? d.s : {}, out = {n, b:bichoValido(d.b) || {f:0,c:0,o:0,b:0,h:0,p:0}, s:{}, r:{}, e:{}, t:num(d.t, 1e14)};
  for (const k of ["d","v","e","l","pd","md","s","ps","ms","ll","tb","tt"]) out.s[k] = num(s[k]);
  out.s.v = Math.min(out.s.v, out.s.d); out.s.tb = Math.min(out.s.tb, out.s.tt); out.s.md = Math.min(out.s.md, LUNA); out.s.ms = Math.min(out.s.ms, LUNA);
  if (d.r && typeof d.r === "object") for (const [k,v] of Object.entries(d.r).slice(0,80)) if (/^g?\d{1,3}$/.test(k) && Array.isArray(v)) out.r[k] = v.slice(0,8).map((x,i) => i ? (Number.isInteger(x) && x >= -1 && x < 300 ? x : -1) : num(x, LUNA));
  if (d.e && typeof d.e === "object") for (const [k,v] of Object.entries(d.e).slice(0,80)) if (/^g?\d{1,3}$/.test(k)) out.e[k] = num(v, 10);

function miPerfilPublico(){
  const p = perfil(), s = stats(), r = {}, e = {};
  for (const [n, x] of Object.entries(datos.retos || {})) if (x && x.resp) r[n] = [x.total, ...x.resp.map(q => q.i === null ? -1 : q.i)];
  for (const [n, x] of Object.entries(datos.gamer || {})) if (x && x.resp) r["g"+n] = [x.total, ...x.resp.map(q => q.i === null ? -1 : q.i)];

  clearTimeout(PERFIL.tPub);

    if (datos.oculto){ PERFIL.lista.delete(p.id); avisarPerfiles(); if (PERFIL.cli && PERFIL.cli.connected) PERFIL.cli.publish(tema, "", {retain:true, qos:1}); return; }

function avisarPerfiles(){
  // la versión pública usa los perfiles como "base de datos" para clasificaciones y porcentajes
  if (!window.claude){
    ONLINE.jugadores = new Map([...PERFIL.lista].map(([id, p]) => [id, {retos:Object.fromEntries(Object.entries(p.r).map(([k,v]) => [k, {t:v[0], i:v.slice(1)}])), estudio:p.e}]));

    if (PERFIL.estado === "si"){ ONLINE.estado = "si"; ONLINE.listo = true; }

function conectarPerfiles(){
  if (PERFIL.cli || !window.mqtt) { if (!window.mqtt && !window.claude){ ONLINE.estado = "no"; estadoOnline(); } return; }
  PERFIL.estado = "conectando";
  try {
    PERFIL.cli = mqtt.connect("wss://public.cloud.shiftr.io", {username:"public", password:"public", clientId:"lunatica-perfil-" + idNuevo(), keepalive:45, reconnectPeriod:4000, connectTimeout:9000, clean:true});
  } catch(e){ PERFIL.estado = "no"; return; }
  PERFIL.cli.on("connect", () => { PERFIL.cli.subscribe(TEMA_PERFILES + "+", {qos:1}, () => { PERFIL.estado = "si"; avisarPerfiles(); publicarPerfil(true); }); });
  PERFIL.cli.on("message", (tema, msg) => {
    const id = tema.slice(TEMA_PERFILES.length); if (!/^[a-z0-9]{8}$/.test(id)) return;
    if (!msg || !msg.length){ if (PERFIL.lista.delete(id)) avisarPerfiles(); return; }
    let d; try { d = perfilLimpio(JSON.parse(msg.toString())); } catch(e){ return; }

  });

  PERFIL.cli.on("error", () => {});
  setTimeout(() => { if (PERFIL.estado !== "si" && !window.claude){ ONLINE.estado = "no"; estadoOnline(); } }, 12000);

/* recuperar un perfil en otro navegador con su código */
function recuperarPerfil(codigo){

  datos.perfil = {id, b:p.b}; datos.nick = p.n; datos.oculto = false;
  datos.stats = {...p.s, vistos:[]};
  for (const [k, v] of Object.entries(p.r)){
    const gamer = k[0] === "g", n = +k.replace("g",""), lista = gamer ? RETOS_GAMER : RETOS, qs = lista[n-1]; if (!qs) continue;
    const resp = v.slice(1).map((i, j) => ({i: i < 0 || !qs[j] || !qs[j].r[i] ? null : i, p: i < 0 || !qs[j] || !qs[j].r[i] ? 0 : qs[j].r[i][2]}));
    const reg = {total:v[0], resp, fecha:hoyISO()}, dest = gamer ? (datos.gamer = datos.gamer || {}) : datos.retos;
    if (!dest[n] || dest[n].total < reg.total) dest[n] = reg;

const METRICAS = {

  pts:{t:"Puntos", val:s => s.pd + s.ps, txt:s => `${s.pd + s.ps} m`, sub:s => `${s.pd} m en duelos · ${s.ps} m en retos`, min:s => s.pd + s.ps > 0},
  mej:{t:"Mejor partida", val:s => Math.max(s.md, s.ms), txt:s => `${Math.max(s.md, s.ms)} m`, sub:s => `${s.d + s.s} partidas jugadas`, min:s => s.md + s.ms > 0},
  lun:{t:"Lunas llenas", val:s => s.ll, txt:s => `${s.ll} 🌕`, sub:s => `respuestas únicas encontradas`, min:s => s.ll > 0},

const $v = document.getElementById("vista");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let reloj = null;
function parar(){ refrescoOnline = null; if (reloj){ clearInterval(reloj); reloj = null; } }
function marcar(v){ document.querySelectorAll("nav.menu button").forEach(b => b.setAttribute("aria-current", b.dataset.ir===v ? "true":"false")); }
function toast(t){ const d = document.createElement("div"); d.className="toast"; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2000); }
function pintar(html){ $v.innerHTML = `<div class="vista pila">${html}</div>`; window.scrollTo({top:0, behavior: reduceMov ? "auto" : "smooth"}); }
function contar(el, hasta, ms=1400){ if (reduceMov){ el.textContent = hasta; return; } const t0 = performance.now(); const paso = n => { const p = Math.min(1,(n-t0)/ms); el.textContent = Math.round(hasta*(1-Math.pow(1-p,3))); if (p<1) requestAnimationFrame(paso); }; requestAnimationFrame(paso); }
function faseLunar(){ const d = (Date.now() - Date.UTC(2000,0,6,18,14))/864e5, f = ((d%29.530588)+29.530588)%29.530588; return f<1.85?"Luna nueva":f<7.4?"Luna creciente":f<14.8?"Gibosa creciente":f<16.6?"Luna llena":f<22.1?"Gibosa menguante":f<27.7?"Luna menguante":"Luna nueva"; }

/* ---------- PARTIDA ---------- */
function jugar(n, esDelDia, multi){
  parar(); marcar(multi ? (multi.vista || "duelo") : esDelDia ? "inicio" : "retos");
  const ps = multi ? multi.ps : RETOS[n-1], est = {i:0, total:0, resp:[]};
  pintar(`
  <div class="fila" style="justify-content:space-between"><span class="etiqueta">${multi ? esc(multi.etiqueta) : `Reto #${n}${esDelDia?" · del día":""}`}</span><div class="dots" id="dots"></div></div>
  ${multi && multi.marcador !== false ? `<div class="marcador" id="marcador"></div>` : ""}
  <section class="tarjeta pila" id="arriba"></section>
  <div class="escena-caja"><canvas class="escena" id="cv"></canvas><div id="sobre"></div></div>
  <section class="tarjeta pila" id="abajo"></section>`);
  Escena.conectar(document.getElementById("cv"), {modo:"vuelo", alt:0});
  const $a = document.getElementById("arriba"), $b = document.getElementById("abajo"), $s = document.getElementById("sobre"), $d = document.getElementById("dots");
  const puntos = () => $d.innerHTML = ps.map((_,k)=>`<i class="${k<est.i?"hecho":""} ${k===est.i?"ahora":""}" style="--c:${k<est.i?tierDe(est.resp[k].p).c:""}"></i>`).join("");
  siguiente();
  function siguiente(){
    if (est.i >= ps.length) return terminar();
    const q = ps[est.i]; let cuenta = 3, seg = SEG, pendiente = null, fin = false;
    puntos();
    $a.innerHTML = `<span class="chip">${CATS[q.c]} · ${DIF_TXT[q.d]}</span><h2 class="pregunta">${esc(q.q)}</h2>`;
    $s.innerHTML = `<div class="cuenta-atras" id="ca"><span>3</span></div>`;
    $b.innerHTML = `
      <form class="entrada" id="form" autocomplete="off">
        <div class="reloj" id="reloj" style="--p:100"><span id="seg">${SEG}</span></div>
        <label for="resp" class="oculto">Tu respuesta</label>
        <input id="resp" placeholder="Prepárate…" disabled maxlength="80">
        <button class="btn" id="lanzar" disabled>Lanzar</button>
      </form>
      <p class="aviso" id="aviso" role="status" aria-live="polite"></p>`;
    const inp = document.getElementById("resp"), av = document.getElementById("aviso"), sg = document.getElementById("seg"), rl = document.getElementById("reloj"), ca = document.getElementById("ca");
    reloj = setInterval(() => {
      if (cuenta > 0){
        cuenta--;
        if (cuenta){ ca.innerHTML = `<span>${cuenta}</span>`; }
        else { ca.remove(); inp.disabled = false; inp.placeholder = "Tu respuesta"; document.getElementById("lanzar").disabled = false; inp.focus(); }
        return;
      }
      seg--; sg.textContent = seg; rl.style.setProperty("--p", seg/SEG*100); if (seg <= 5) rl.style.setProperty("--rc","#ff6b81");
      if (seg <= 0) cerrar(null);
    }, 1000);
    document.getElementById("form").onsubmit = ev => {
      ev.preventDefault(); if (fin || cuenta>0) return;
      const t = inp.value;
      if (pendiente !== null && norm(t) === norm(q.r[pendiente][0])) return cerrar(pendiente);
      pendiente = null; av.className = "aviso";
      const j = juzgar(t, q);
      if (j.tipo === "ok") return cerrar(j.i);
      if (j.tipo === "vacio") return;
      inp.classList.remove("tiembla"); void inp.offsetWidth;
      if (j.tipo === "mala"){ av.className="aviso mal"; av.textContent = `«${t.trim()}» no vale: ${j.x[2] || "no cumple la pregunta"}. Prueba otra.`; inp.classList.add("tiembla"); }
      else if (j.tipo === "sugerencia"){ pendiente = j.i; inp.value = q.r[j.i][0]; av.className="aviso sug"; av.textContent = `¿Querías decir «${q.r[j.i][0]}»? Pulsa Lanzar para confirmar o cámbiala.`; }
      else { av.className="aviso mal"; av.textContent = `«${t.trim()}» no está en la lista. Prueba otra.`; inp.classList.add("tiembla"); }
      inp.select();
    };
    function cerrar(i){
      if (fin) return; fin = true; parar();
      const p = i===null ? 0 : q.r[i][2], r = i===null ? null : q.r[i], t = tierDe(p);
      est.resp.push({i, p}); est.total += p; est.i++; puntos();
      Escena.subir(est.total); if (p >= 60) Escena.rafaga(t.c, p===100 ? 90 : 40); if (multi) multi.paso(est);
      $s.innerHTML = "";
      $a.innerHTML = `<div style="--c:${t.c}" class="pila"><div class="tier">${t.n}</div>
        ${r ? `<div class="fila"><b style="font-size:21px">${esc(r[0])}</b><span class="mas">+${p} m</span></div>` : `<b class="suave">Sin respuesta</b>`}
        <p class="suave">${t.m}</p></div>`;
      $b.innerHTML = `${r && r[3] ? `<div class="aprende" style="--c:var(--t100)"><b>Dato de la Luna llena</b>${esc(r[3])}</div>` : ""}
        <div class="aprende"><b>Aprende</b>${esc(q.i)}</div>
        <button class="btn ancho" id="seguir">${est.i >= ps.length ? "Ver el viaje" : "Seguir subiendo"}</button>`;
      const b = document.getElementById("seguir"); b.focus({preventScroll:true}); b.onclick = siguiente;
    }
  }
  function terminar(){
    if (multi) return multi.fin(est);
    const reg = {total:est.total, resp:est.resp, fecha:hoyISO()};
    const previo = datos.retos[n];
    if (!previo || previo.total < reg.total) datos.retos[n] = reg;
    if (esDelDia) datos.dias[hoyISO()] = {...reg, reto:n};
    guardar(); guardarRetoOnline(n, reg); apuntarPartida(reg.total, reg.resp);
    resultados(n, reg, true, esDelDia, previo);
  }
}

function jugarGamer(n){

/* ---------- DUELOS EN DIRECTO: salas con código (1 vs 1 y 2 vs 2) ---------- */
const COL_EQ = {A:"#7fb2ff", B:"#ff6b81"};
const NOM_EQ = {A:"Equipo Azul", B:"Equipo Rojo"};
let SALA = null;
/* Salas por conexión directa entre navegadores (PeerJS), para la versión pública fuera de Claude.
   El primero que entra con un código hace de servidor de la sala y reparte el estado a los demás. */
function salaP2P(nombre){
  return new Promise((resolver, rechazar) => {
    const idHost = "lunatica-v1-" + nombre;
    const st = {peers:new Map(), cbs:new Set(), conns:new Map(), snap:[], esHost:false, toHost:null, yoId:null, listo:false};
    const pres = {};
    let peer = null;
    const emitir = () => { st.snap = Object.freeze([...st.peers.values()].map(p => Object.freeze({peer:p.peer, presence:p.presence, kind:"viewer", sameTab:p.peer===st.yoId, isMe:p.peer===st.yoId}))); st.cbs.forEach(f => { try { f({peers:st.snap}); } catch(e){} }); };
    const difundir = () => { const l = [...st.peers.values()].map(p => ({peer:p.peer, presence:p.presence})); st.conns.forEach(c => { if (c.open) c.send({t:"lista", l}); }); };
    const api = {
      presence: async patch => {
        for (const k in patch) patch[k] === null ? delete pres[k] : pres[k] = patch[k];
        if (st.esHost){ st.peers.set(st.yoId, {peer:st.yoId, presence:{...pres}}); difundir(); emitir(); }
        else if (st.toHost && st.toHost.open) st.toHost.send({t:"pres", p:{...pres}});
      },
      peers: () => st.snap,
      onPeers: f => { st.cbs.add(f); return () => st.cbs.delete(f); },
      leave: async () => { try { peer && peer.destroy(); } catch(e){} st.cbs.clear(); }
    };
    const tiempo = setTimeout(() => { if (!st.listo){ try { peer && peer.destroy(); } catch(e){} rechazar({code:"upstream_error"}); } }, 12000);
    const listo = () => { st.listo = true; clearTimeout(tiempo); resolver(api); };
    // 1) intentamos ser el anfitrión de la sala
    peer = new Peer(idHost);
    peer.on("open", id => {
      st.esHost = true; st.yoId = id;
      peer.on("connection", c => {
        st.conns.set(c.peer, c);
        c.on("open", () => difundir());
        c.on("data", d => { if (d && d.t === "pres" && d.p && typeof d.p === "object"){ st.peers.set(c.peer, {peer:c.peer, presence:d.p}); difundir(); emitir(); } });
        const fuera = () => { st.conns.delete(c.peer); st.peers.delete(c.peer); difundir(); emitir(); };
        c.on("close", fuera); c.on("error", fuera);
      });
      listo();
    });
    peer.on("error", e => {
      if (e.type === "unavailable-id" && !st.listo){
        // 2) la sala ya existe: entramos como invitado
        try { peer.destroy(); } catch(x){}
        peer = new Peer();
        peer.on("open", id => {
          st.yoId = id;
          const c = peer.connect(idHost, {reliable:true});
          c.on("open", () => { st.toHost = c; c.send({t:"pres", p:{...pres}}); listo(); });
          c.on("data", d => { if (d && d.t === "lista" && Array.isArray(d.l)){ st.peers = new Map(d.l.map(p => [p.peer, p])); emitir(); } });
          c.on("close", () => { toast("La sala se ha cerrado: el anfitrión ha salido."); st.peers.clear(); emitir(); });
        });
        peer.on("error", e2 => { if (!st.listo){ clearTimeout(tiempo); rechazar({code:"upstream_error"}); } });
      } else if (!st.listo){ clearTimeout(tiempo); rechazar({code:"upstream_error"}); }
    });
  });
}

/* Salas por un servidor público de mensajes (MQTT sobre WebSocket por el puerto 443).
   Cada jugador anuncia su estado cada pocos segundos; quien deja de anunciarse sale de la sala. */
function salaMQTT(nombre){
  return new Promise((resolver, rechazar) => {
    const base = "lunatica/v2/" + nombre, yoId = Math.random().toString(36).slice(2, 12);
    const st = {peers:new Map(), cbs:new Set(), snap:Object.freeze([]), listo:false, pres:{}, timers:[], pend:false};
    const temaYo = base + "/p/" + yoId;
    let cli;
    try {
      cli = mqtt.connect("wss://public.cloud.shiftr.io", {username:"public", password:"public", clientId:"lunatica-" + yoId, keepalive:30, reconnectPeriod:2000, connectTimeout:8000, clean:true,
        will:{topic:temaYo, payload:JSON.stringify({bye:true}), qos:0, retain:false}});
    } catch(e){ return rechazar({code:"upstream_error"}); }
    const emitir = () => {
      if (st.pend) return; st.pend = true;
      requestAnimationFrame(() => { st.pend = false;
        st.snap = Object.freeze([...st.peers.values()].map(p => Object.freeze({peer:p.peer, presence:p.presence, kind:"viewer", sameTab:p.peer === yoId, isMe:p.peer === yoId})));
        st.cbs.forEach(f => { try { f({peers:st.snap}); } catch(e){} }); });
    };
    const anunciar = () => { if (cli && cli.connected) cli.publish(temaYo, JSON.stringify({p:st.pres, t:Date.now()})); };
    const api = {
      presence: async patch => {
        for (const k in patch) patch[k] === null ? delete st.pres[k] : st.pres[k] = patch[k];
        st.peers.set(yoId, {peer:yoId, presence:{...st.pres}, visto:Date.now()}); emitir(); anunciar();
      },
      peers: () => st.snap,
      onPeers: f => { st.cbs.add(f); return () => st.cbs.delete(f); },
      leave: async () => { st.timers.forEach(clearInterval); try { cli.publish(temaYo, JSON.stringify({bye:true})); cli.end(false); } catch(e){} st.cbs.clear(); }
    };
    cli.on("message", (tema, msg) => {
      const id = tema.slice((base + "/p/").length); if (!id || id === yoId) return;
      let d; try { d = JSON.parse(msg.toString()); } catch(e){ return; }
      if (d && d.bye){ if (st.peers.delete(id)) emitir(); return; }
      if (d && d.p && typeof d.p === "object"){ const nuevo = !st.peers.has(id); st.peers.set(id, {peer:id, presence:d.p, visto:Date.now()}); emitir(); if (nuevo) anunciar(); }
    });
    const tiempo = setTimeout(() => { if (!st.listo){ try { cli.end(true); } catch(e){} rechazar({code:"upstream_error"}); } }, 10000);
    cli.on("connect", () => {
      cli.subscribe(base + "/p/+", err => {
        if (err){ if (!st.listo){ clearTimeout(tiempo); rechazar({code:"upstream_error"}); } return; }
        anunciar();
        if (!st.listo){
          st.listo = true; clearTimeout(tiempo);
          st.timers.push(setInterval(anunciar, 2500));

  const h1 = document.getElementById("fin-tit");
  if (h1.textContent !== titulo){
    h1.textContent = titulo;
    if (todos && !h1.classList.contains("hecho")){ h1.classList.add("hecho"); if (gano){ h1.classList.add("gana"); confeti(); } }
  }
  pintarMarcador(document.getElementById("fin-marcador"), js, modo);
  const esp = document.getElementById("fin-espera"), te = todos ? "" : js.filter(j=>j.fase!=="fin").map(j=>`${j.nick} va por la pregunta ${Math.min(7,j.k+1)} de 7`).join(" · ");
  if (esp.textContent !== te) esp.textContent = te;
  const bt = document.getElementById("fin-botones"), hb = `${SALA.yo.host && todos ? `<button class="btn" id="revancha">Revancha con otras preguntas</button>` : todos ? `<p class="suave">El anfitrión puede empezar la revancha.</p>` : ""}<button class="btn sec" id="salir">Salir de la sala</button>`;
  if (bt._html !== hb){ bt._html = hb; bt.innerHTML = hb;
    const rv = document.getElementById("revancha"); if (rv) rv.onclick = () => empezarDuelo(Math.floor(Math.random()*1e9) + 1);
    document.getElementById("salir").onclick = () => vistaDuelo(); }
}
/* confeti para el ganador (una sola vez) */
function confeti(){
  if (reduceMov) return;
  const cv = document.createElement("canvas"); cv.className = "confeti"; document.body.appendChild(cv);
  const ctx = cv.getContext("2d"), dpr = Math.min(2, devicePixelRatio || 1); cv.width = innerWidth*dpr; cv.height = innerHeight*dpr; ctx.scale(dpr, dpr);
  const cols = ["#ffd166","#ff7a3d","#5ee0c1","#7fb2ff","#ff6b81","#f2e9c9"];
  const ps = Array.from({length:140}, () => ({x:innerWidth/2 + (Math.random()-.5)*120, y:innerHeight*.35, vx:(Math.random()-.5)*11, vy:-Math.random()*12-4, r:Math.random()*6.3, vr:(Math.random()-.5)*.3, w:5+Math.random()*6, c:cols[Math.random()*cols.length|0]}));
  const t0 = performance.now();
  const paso = t => { const k = (t - t0)/1000; ctx.clearRect(0,0,innerWidth,innerHeight);
    for (const p of ps){ p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.globalAlpha = Math.max(0, 1 - k/3.2); ctx.fillStyle = p.c; ctx.fillRect(-p.w/2,-p.w/4,p.w,p.w/2); ctx.restore(); }
    if (k < 3.2) requestAnimationFrame(paso); else cv.remove(); };
  requestAnimationFrame(paso);
}

/* ---------- navegación ---------- */
const VISTAS = {inicio:vistaInicio, retos:vistaRetos, duelo:vistaDuelo, estudio:vistaEstudio, progreso:vistaProgreso, perfil:vistaPerfil, ranking:vistaRanking};
document.addEventListener("click", e => { const b = e.target.closest("[data-ir]"); if (b){ e.preventDefault(); if (b.dataset.ir !== "duelo") salirSala(); (VISTAS[b.dataset.ir]||vistaInicio)(); } });
document.getElementById("ir-inicio").onclick = () => { salirSala(); vistaInicio(); };
perfil(); guardar(); pintarYo(); vistaInicio(); estadoOnline(); conectarPerfiles();
