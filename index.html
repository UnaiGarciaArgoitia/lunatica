<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lunática</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Un solo mundo: noche lunar. Columna central; la escena animada del cohete es el centro de cada pantalla. */
  --cielo:#0b1120;
  --panel:#141d35cc;
  --panel-solido:#141d35;
  --panel-2:#1e2b4d;
  --linea:#2c3b63;
  --texto:#eef1f8;
  --suave:#9ba8c6;
  --llama:#ff7a3d;
  --luna:#f2e9c9;
  --t10:#7fb2ff; --t30:#5ee0c1; --t60:#ffb347; --t85:#c58bff; --t100:#f2e9c9;
  --error:#ff6b81;
  --display:"Unbounded","Trebuchet MS",system-ui,sans-serif;
  --cuerpo:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--cielo);color:var(--texto);font-family:var(--cuerpo);font-size:17px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--llama);outline-offset:2px}
.app{max-width:680px;margin:0 auto;padding:14px 16px 40px;display:flex;flex-direction:column;gap:14px;min-height:100%}
header.barra{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.04em;display:flex;align-items:center;gap:10px;background:none;border:0;padding:0}
.logo svg{width:30px;height:30px}
nav.menu{display:flex;gap:6px;flex-wrap:wrap}
nav.menu button{background:var(--panel-solido);border:1px solid var(--linea);border-radius:999px;padding:6px 14px;font-size:14px;transition:border-color .2s,color .2s}
nav.menu button[aria-current="true"]{border-color:var(--llama);color:var(--llama)}
.tarjeta{background:var(--panel-solido);border:1px solid var(--linea);border-radius:18px;padding:20px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:clamp(28px,6.5vw,44px);font-weight:800}
h2{font-size:20px;font-weight:600}
p{margin:0}
.suave{color:var(--suave)}
.pila{display:flex;flex-direction:column;gap:12px}
.fila{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{background:var(--llama);color:#1a0e05;border:0;border-radius:14px;padding:14px 20px;font-weight:700;font-size:17px;font-family:var(--display);letter-spacing:.02em;transition:transform .15s,filter .15s}
.btn:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.08)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:default}
.btn.sec{background:var(--panel-2);color:var(--texto);border:1px solid var(--linea);font-family:var(--cuerpo)}
.btn.ancho{width:100%}
.etiqueta{font-family:var(--display);font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--suave)}
.objetivo{font-family:var(--display);color:var(--luna);font-size:15px;letter-spacing:.06em}
/* escena animada */
.escena-caja{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--linea);background:#070b16}
canvas.escena{display:block;width:100%;height:clamp(230px,40vh,400px)}
.escena-caja.alta canvas.escena{height:clamp(300px,52vh,520px)}
.sobre{position:absolute;inset:auto 0 0 0;padding:16px;display:flex;flex-direction:column;gap:10px;background:linear-gradient(transparent,#070b16ee 40%)}
.sobre-arriba{position:absolute;inset:0 0 auto 0;padding:16px 18px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.cuenta-atras{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:96px;color:var(--luna);text-shadow:0 0 30px #f2e9c988;pointer-events:none}
.cuenta-atras span{animation:latido .9s ease-out both}
@keyframes latido{from{transform:scale(1.8);opacity:0}30%{opacity:1}to{transform:scale(.8);opacity:0}}
/* juego */
.dots{display:flex;gap:6px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--linea);display:block;transition:background .4s,transform .3s}
.dots i.hecho{background:var(--c)}
.dots i.ahora{outline:2px solid var(--texto);transform:scale(1.15)}
.pregunta{font-family:var(--display);font-size:clamp(21px,4.8vw,29px);font-weight:600;animation:entra .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes entra{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.chip{display:inline-flex;font-size:13px;border:1px solid var(--linea);border-radius:999px;padding:3px 10px;color:var(--suave);align-self:flex-start}
.entrada{display:flex;gap:8px;align-items:center}
.reloj{flex:none;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--rc,var(--llama)) calc(var(--p)*1%),var(--panel-2) 0);transition:--p 1s linear}
.reloj span{background:#0b1120;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:19px;font-variant-numeric:tabular-nums}
.entrada input{flex:1;min-width:0;background:#0b1120;border:2px solid var(--linea);border-radius:14px;padding:13px 14px;font-size:18px;transition:border-color .2s}
.entrada input:focus{border-color:var(--llama);outline:none}
.entrada input.tiembla{animation:tiembla .35s}
@keyframes tiembla{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.aviso{min-height:24px;font-size:15px}
.aviso.mal{color:var(--error)}
.aviso.sug{color:var(--luna)}
.tier{font-family:var(--display);font-weight:800;font-size:clamp(30px,8vw,48px);color:var(--c);text-shadow:0 0 24px color-mix(in srgb,var(--c) 45%,transparent);animation:pop .55s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.mas{font-family:var(--display);font-weight:600;color:var(--c);animation:sube 1s ease-out both .2s}
@keyframes sube{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
.aprende{background:var(--panel-2);border-left:4px solid var(--c,var(--llama));border-radius:10px;padding:12px 14px;font-size:15px;animation:entra .5s both .35s}
.aprende b{font-family:var(--display);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--suave);display:block;margin-bottom:4px}
/* niveles */
.niveles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.nivel{border-radius:10px;padding:8px 4px;text-align:center;background:var(--panel-2);border-top:3px solid var(--c)}
.nivel b{display:block;font-family:var(--display);font-size:16px}
.nivel span{font-size:12px;color:var(--suave);line-height:1.2;display:block}
/* mapa de retos */
.mapa{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.reto{position:relative;aspect-ratio:1;border-radius:18px;border:1px solid var(--linea);background:var(--panel-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .2s,border-color .2s}
.reto:hover:not(:disabled){transform:translateY(-3px);border-color:var(--llama)}
.reto b{font-family:var(--display);font-size:22px}
.reto small{font-size:12px;color:var(--suave);font-variant-numeric:tabular-nums}
.reto.hecho{border-color:var(--c)}
.reto.hecho::after{content:"";position:absolute;left:10px;right:10px;bottom:8px;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--c) var(--pc),#ffffff18 0)}
.reto.dia{outline:2px solid var(--luna);outline-offset:2px}
.reto:disabled{opacity:.4;cursor:not-allowed}
.estrellas{color:var(--luna);letter-spacing:2px;font-size:13px}
/* resultados */
.total{font-family:var(--display);font-weight:800;font-size:68px;line-height:1;font-variant-numeric:tabular-nums}
.total small{font-size:22px;color:var(--suave)}
.lista-resp{display:flex;flex-direction:column;gap:8px}
details.item{background:var(--panel-2);border-radius:12px;border-left:4px solid var(--c,var(--linea));animation:entra .4s both;animation-delay:calc(var(--k)*70ms)}
details.item summary{list-style:none;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;cursor:pointer}
details.item summary::-webkit-details-marker{display:none}
details.item .pts{font-family:var(--display);font-weight:600;color:var(--c);text-align:right}
details.item .q{font-size:14px;color:var(--suave);grid-column:1/-1}
details.item .cuerpo{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px;font-size:15px}
.grupo h4{margin:0 0 4px;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--c);font-family:var(--display);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chips span{background:#0b1120;border-radius:6px;padding:2px 8px;font-size:14px}
.chips span.mia{outline:2px solid var(--c)}
/* estudio */
.opciones{display:grid;gap:10px}
.opcion{text-align:left;background:var(--panel-2);border:2px solid var(--linea);border-radius:14px;padding:14px 16px;font-size:17px;transition:border-color .2s,background .3s,transform .15s;animation:entra .35s both;animation-delay:calc(var(--k)*60ms)}
.opcion:hover:not(:disabled){border-color:var(--suave);transform:translateX(3px)}
.opcion.bien{border-color:var(--t30);background:#123b37}
.opcion.malo{border-color:var(--error);background:#3b1622;animation:tiembla .35s}
.opcion:disabled{cursor:default}
.barra-prog{height:8px;border-radius:999px;background:var(--panel-2);overflow:hidden}
.barra-prog i{display:block;height:100%;background:var(--llama);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stat{background:var(--panel-2);border-radius:12px;padding:12px}
.stat b{display:block;font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--suave)}
.pie{font-size:13px;color:var(--suave);text-align:center;margin-top:auto}
.oculto{display:none!important}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--luna);color:#1b1608;padding:10px 16px;border-radius:12px;font-weight:700;animation:entra .3s both;z-index:9}
.vista{animation:entra .35s both}

/* fondo de toda la página: estrellas que se mueven despacio */
body::before,body::after{content:"";position:fixed;inset:-50%;z-index:-1;pointer-events:none}
body::before{background-image:radial-gradient(1px 1px at 20px 30px,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 120px 80px,#fff6 50%,transparent 51%),radial-gradient(1.5px 1.5px at 200px 160px,#cfe0ff88 50%,transparent 51%),radial-gradient(1px 1px at 60px 190px,#fff5 50%,transparent 51%),radial-gradient(1px 1px at 170px 240px,#ffe6c066 50%,transparent 51%);background-size:250px 260px;animation:deriva 120s linear infinite}
body::after{background:radial-gradient(40% 30% at 20% 20%,#5b3fd622,transparent 70%),radial-gradient(35% 30% at 85% 70%,#16a3b522,transparent 70%),radial-gradient(30% 25% at 60% 10%,#ff7a3d14,transparent 70%)}
@keyframes deriva{to{transform:translate(250px,260px)}}
.tarjeta{background:linear-gradient(180deg,#18223fe6,#101830e6);backdrop-filter:blur(8px);box-shadow:0 10px 40px #0006,inset 0 1px 0 #ffffff10}
.btn{background:linear-gradient(135deg,#ffc06b,#ff7a3d 55%,#ff5a36);box-shadow:0 6px 24px #ff7a3d44,inset 0 1px 0 #ffffff55}
.btn.sec{background:linear-gradient(180deg,#24335a,#1b2746);box-shadow:inset 0 1px 0 #ffffff14}
.escena-caja{box-shadow:0 20px 60px #0008,0 0 0 1px #ffffff0d inset}
.online{font-size:12.5px;border-radius:999px;padding:4px 10px 4px 22px;position:relative;border:1px solid var(--linea);color:var(--suave);background:var(--panel-solido)}
.online::before{content:"";position:absolute;left:9px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:var(--suave)}
.online.si{color:#bff5e6;border-color:#2c6b5d}
.online.si::before{background:var(--t30);box-shadow:0 0 0 0 #5ee0c1aa;animation:pulso 2s infinite}
.online.conectando::before{background:var(--t60);animation:pulso 1s infinite}
@keyframes pulso{70%{box-shadow:0 0 0 7px #5ee0c100}100%{box-shadow:0 0 0 0 #5ee0c100}}
.online-mini{font-size:12px;color:var(--t30);font-family:var(--display);letter-spacing:.08em;text-transform:uppercase}
.ranking{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ranking li{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;background:var(--panel-2);border-radius:12px;padding:9px 12px;animation:entra .4s both;animation-delay:calc(var(--k)*60ms)}
.ranking li.yo{outline:2px solid var(--llama);background:#2a2340}
.ranking .pos{font-family:var(--display);font-weight:800;color:var(--suave);text-align:center}
.ranking li:nth-child(1) .pos{color:#ffd166}.ranking li:nth-child(2) .pos{color:#d6dbe6}.ranking li:nth-child(3) .pos{color:#e0a36c}
.ranking .nom{display:flex;flex-direction:column}.ranking .nom small{font-size:12px;color:var(--suave)}
.ranking b{font-family:var(--display);font-variant-numeric:tabular-nums}
.chips em{font-style:normal;color:var(--suave);font-size:12px;margin-left:4px}
.pct{color:var(--t30)}

.campo,.codigo{background:#0b1120;border:2px solid var(--linea);border-radius:14px;padding:12px 14px;font-size:18px}
.campo:focus,.codigo:focus{border-color:var(--llama);outline:none}
.codigo{flex:1;min-width:0;text-transform:uppercase;letter-spacing:.4em;font-family:var(--display);font-weight:800;text-align:center}
.modos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modo{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;padding:20px;border-radius:18px;border:1px solid var(--linea);background:linear-gradient(160deg,#22305a,#121a33);box-shadow:0 10px 40px #0006;transition:transform .2s,border-color .2s,box-shadow .2s}
.modo:hover{transform:translateY(-4px);border-color:var(--llama);box-shadow:0 14px 44px #ff7a3d33}
.modo .vs{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;background:linear-gradient(90deg,#7fb2ff,#ff6b81);-webkit-background-clip:text;background-clip:text;color:transparent}
.modo .vs small{font-size:16px;margin:0 6px;color:var(--suave);-webkit-text-fill-color:var(--suave)}
.modo b{font-family:var(--display);font-size:16px}.modo small{color:var(--suave);font-size:13.5px}
.codigo-grande{display:flex;justify-content:center;gap:.12em;font-family:var(--display);font-weight:800;font-size:clamp(46px,14vw,80px);color:var(--luna);text-shadow:0 0 30px #f2e9c955}
.codigo-grande span{display:inline-block;min-width:.9em;text-align:center;padding:.04em .1em;border-radius:.18em;background:linear-gradient(180deg,#ffffff12,#ffffff04);border:1px solid #ffffff1a;animation:sube .6s cubic-bezier(.2,.9,.3,1) both;animation-delay:calc(var(--k)*80ms)}
.equipos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.equipo{border:1px solid color-mix(in srgb,var(--c) 55%,transparent);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 14%,transparent),color-mix(in srgb,var(--c) 3%,transparent));box-shadow:inset 0 1px 0 #ffffff12}
.equipo h3{font-size:15px;color:var(--c);letter-spacing:.04em}
.equipo ul,.jugs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.jug{display:flex;align-items:center;gap:10px;background:var(--panel-2);border-radius:12px;padding:8px 10px;border:1px solid #ffffff0d}
.jug.nuevo{animation:entra .45s cubic-bezier(.2,.8,.2,1) both}
.jug.yo{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 0 18px color-mix(in srgb,var(--c) 30%,transparent)}
.jug.hueco{opacity:.45;border-style:dashed;border-color:var(--linea)}
.jug.hueco .avatar{background:transparent;border:1px dashed var(--suave);color:var(--suave);box-shadow:none;animation:pulsoSuave 1.6s ease-in-out infinite}
@keyframes pulsoSuave{50%{opacity:.35}}
.jug small{margin-left:auto;font-size:11px;color:var(--luna);border:1px solid #f2e9c955;border-radius:999px;padding:2px 8px}
.avatar{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:13px;color:#0b1120;background:radial-gradient(circle at 35% 30%,#fff8,transparent 45%),var(--c,var(--llama));box-shadow:0 0 14px color-mix(in srgb,var(--c,var(--llama)) 50%,transparent)}
.btn.listo{animation:latePulso 1.6s ease-in-out infinite}
@keyframes latePulso{50%{box-shadow:0 6px 34px #ff7a3d99,inset 0 1px 0 #ffffff55}}
/* marcador en directo */
.marcador{display:flex;flex-direction:column;gap:10px}
.mfilas{display:flex;flex-direction:column;gap:6px}
.mequipo{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:16px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 12%,transparent),transparent);border:1px solid color-mix(in srgb,var(--c) 35%,transparent)}
.mcab b{color:var(--c);font-family:var(--display);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.mfila{position:relative;display:grid;grid-template-columns:28px minmax(60px,1fr) 2fr auto;gap:6px 10px;align-items:center;background:linear-gradient(180deg,#1a2442ee,#121a32ee);border:1px solid #ffffff12;border-radius:14px;padding:8px 12px;box-shadow:0 6px 20px #0004}
.mfila.nueva{animation:entra .4s both}
.mfila.yo{border-color:color-mix(in srgb,var(--c) 70%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 40%,transparent),0 6px 20px #0004}
.mfila.lider .mnom::after{content:" 👑";font-size:12px}
.mfila.acabado .mnum::after{content:"✓";margin-left:6px;color:var(--t30);font-size:12px}
.mfila.brilla{animation:brilloFila 1.1s ease-out}
@keyframes brilloFila{0%{box-shadow:0 0 0 2px var(--c),0 0 30px color-mix(in srgb,var(--c) 60%,transparent)}100%{box-shadow:0 0 0 0 transparent,0 6px 20px #0004}}
.mnom{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbar{position:relative;height:12px;border-radius:999px;background:#0b1120;overflow:hidden;box-shadow:inset 0 1px 3px #0008}
.mbar i{position:relative;display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 55%,#0b1120),var(--c));box-shadow:0 0 12px var(--c);transition:width 1s cubic-bezier(.2,.8,.2,1);overflow:hidden}
.mbar i::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,#ffffff55 50%,transparent 70%);transform:translateX(-100%);animation:reflejo 2.6s ease-in-out infinite}
@keyframes reflejo{60%,100%{transform:translateX(100%)}}
.mnum{font-family:var(--display);font-variant-numeric:tabular-nums;min-width:66px;text-align:right}
.mdots{grid-column:2/-1;display:flex;gap:5px}
.mdots i{width:10px;height:10px;border-radius:50%;display:block;background:#ffffff14;transition:background .4s,box-shadow .4s}
.mdots i.lleno{box-shadow:0 0 8px currentColor}
.ganancia{position:absolute;right:96px;top:8px;font-family:var(--display);font-weight:800;font-size:13px;color:var(--c);text-shadow:0 0 10px var(--c);pointer-events:none;animation:flota 1.5s ease-out forwards}
@keyframes flota{0%{opacity:0;transform:translateY(10px)}20%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}
.tira{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-family:var(--display);font-variant-numeric:tabular-nums}
.tira .ta{color:#7fb2ff}.tira .tb{color:#ff6b81}
.tira[data-gana="A"] .ta,.tira[data-gana="B"] .tb{text-shadow:0 0 14px currentColor}
.tira-bar{position:relative;height:14px;border-radius:999px;background:linear-gradient(90deg,#ff6b81aa,#ff6b81);overflow:hidden;box-shadow:inset 0 1px 3px #0008,0 0 16px #ff6b8133}
.tira-bar i{display:block;height:100%;width:50%;background:linear-gradient(90deg,#7fb2ff,#9cc4ff);box-shadow:0 0 16px #7fb2ff;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.tira-vs{position:absolute;inset:0;display:grid;place-items:center;font-size:9px;font-weight:800;letter-spacing:.1em;color:#0b1120cc}
.fin-tit{font-family:var(--display);font-weight:800;font-size:clamp(24px,6vw,38px);color:var(--luna)}
.fin-tit.hecho{animation:entra .5s cubic-bezier(.2,.8,.2,1) both}
.fin-tit.gana{background:linear-gradient(90deg,#ffd166,#ff7a3d,#ffd166);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:entra .5s both,brilloTexto 3s linear infinite}
@keyframes brilloTexto{to{background-position:-200% 0}}
canvas.confeti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:20}
/* bichito y perfil */
.yo-btn{display:flex;align-items:center;gap:6px;background:var(--panel-solido);border:1px solid var(--linea);border-radius:999px;padding:2px 12px 2px 4px;font-size:13.5px;font-weight:700;max-width:180px;transition:border-color .2s,transform .2s}
.yo-btn:hover{border-color:var(--llama);transform:translateY(-1px)}
.yo-btn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.yo-btn svg{flex:none}
svg.bicho{display:block;overflow:visible}
.bicho-escenario{position:relative;display:grid;place-items:center;height:220px;border-radius:18px;border:1px solid var(--linea);overflow:hidden;background:radial-gradient(60% 50% at 50% 100%,#2a3d72,transparent 70%),radial-gradient(1px 1px at 20% 30%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 80% 20%,#fff6 50%,transparent 51%),radial-gradient(1.5px 1.5px at 65% 60%,#cfe0ff88 50%,transparent 51%),radial-gradient(1px 1px at 35% 70%,#fff5 50%,transparent 51%),linear-gradient(180deg,#0b1430,#141d3d)}
#bicho-grande{animation:flotar 3.2s ease-in-out infinite}
#bicho-grande.salta svg{animation:saltito .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes flotar{50%{transform:translateY(-8px)}}
@keyframes saltito{0%{transform:translateY(0)}40%{transform:translateY(-22px) rotate(-4deg)}100%{transform:none}}
.colores{display:flex;flex-wrap:wrap;gap:8px}
.color{width:34px;height:34px;border-radius:50%;border:3px solid transparent;background:var(--c);box-shadow:inset 0 -4px 0 #0003;transition:transform .15s,border-color .15s}
.color:hover{transform:scale(1.08)}
.color.activo{border-color:#fff;box-shadow:0 0 0 3px var(--c),inset 0 -4px 0 #0003}
.opciones-bicho{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.opc{display:flex;flex-direction:column;gap:6px}
.sel{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:6px;background:var(--panel-2);border-radius:14px;padding:4px}
.sel b{text-align:center;font-size:15px}
.flecha{padding:6px 0;font-size:22px;line-height:1}
.codigo-jugador{font-family:var(--display);font-weight:800;font-size:clamp(26px,8vw,40px);letter-spacing:.12em;text-align:center;color:var(--luna);background:#0b1120;border:1px dashed var(--linea);border-radius:14px;padding:10px;user-select:all}
.crea-bicho{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-color:#ff7a3d66;background:linear-gradient(120deg,#2a1f3fe6,#16203ee6)}
.mini-bicho{animation:flotar 3s ease-in-out infinite}
.avatar-b{flex:none;display:grid;place-items:center;width:38px;height:38px}
.mfila .avatar.avatar-b{background:none;box-shadow:none;width:34px;height:34px}
.mfila{grid-template-columns:34px minmax(60px,1fr) 2fr auto}
.zona-gamer{border-color:#c58bff55;background:linear-gradient(160deg,#241a44e6,#121a33e6)}
.reto.gamer b{font-size:19px}
.tema-gamer{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;padding:12px 16px;border-radius:14px;border:1px solid #c58bff55;background:linear-gradient(120deg,#241a44,#151d38);cursor:pointer}
.tema-gamer input{width:20px;height:20px;accent-color:#c58bff;grid-row:span 2}
.tema-gamer span{font-weight:700}.tema-gamer small{color:var(--suave);font-size:13px}
/* clasificación */
.pestanas{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.pestanas button{flex:none;background:var(--panel-2);border:1px solid var(--linea);border-radius:999px;padding:7px 14px;font-size:14px;white-space:nowrap}
.pestanas button[aria-selected="true"]{background:linear-gradient(135deg,#ffc06b,#ff7a3d);color:#1a0e05;border-color:transparent;font-weight:700}
.podio{display:grid;grid-template-columns:repeat(3,1fr);align-items:end;gap:8px;min-height:60px;margin-top:6px}
.podio>p{grid-column:1/-1}
.pod{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;animation:sube .6s cubic-bezier(.2,.9,.3,1) both}
.pod.p1{animation-delay:.15s}.pod.p3{animation-delay:.25s}
.pod-bicho{animation:flotar 3s ease-in-out infinite}
.pod.p1 .pod-bicho{animation-duration:2.4s}
.pod-nom{font-family:var(--display);font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod-val{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;color:var(--luna)}
.pod-base{width:100%;border-radius:12px 12px 4px 4px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:26px;color:#0b1120}
.pod.p1 .pod-base{height:84px;background:linear-gradient(180deg,#ffe08a,#e0a93a);box-shadow:0 0 30px #ffd16655}
.pod.p2 .pod-base{height:60px;background:linear-gradient(180deg,#eef2f8,#a9b3c6)}
.pod.p3 .pod-base{height:44px;background:linear-gradient(180deg,#f1b98a,#b8743f)}
.pod.yo .pod-nom{color:var(--llama)}
.ranking li.quieto{animation:none}
.ranking .nom small{display:block}
@media (max-width:480px){.modos,.equipos{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:480px){.nivel span{font-size:10.5px}.total{font-size:54px}.mapa{grid-template-columns:repeat(auto-fill,minmax(78px,1fr))}.reto b{font-size:19px}}
</style>
</head>

ndial\". La creó Tim Berners-Lee en 1989."},{"c":"tecnologia","d":"facil","q":"¿Qué componente se considera el \"cerebro\" del ordenador?","a":["El procesador (CPU)","El monitor","La fuente de alimentación","El ratón"],"e":"La CPU ejecuta las instrucciones de los programas."},{"c":"tecnologia","d":"facil","q":"¿Qué cantidad de información es mayor?","a":["1 terabyte","1 gigabyte","1 megabyte","1 kilobyte"],"e":"1 TB son unos 1.000 GB; 1 GB, unos 1.000 MB; y 1 MB, unos 1.000 KB."},{"c":"tecnologia","d":"facil","q":"¿Qué empresa desarrolla el sistema operativo Android?","a":["Google","Apple","Microsoft","Samsung"],"e":"Google compró Android en 2005 y el primer móvil con él salió en 2008."},{"c":"tecnologia","d":"facil","q":"¿Para qué sirve un antivirus?","a":["Para detectar y eliminar programas maliciosos","Para acelerar internet","Para comprimir archivos","Para editar fotos"],"e":"Protege frente a virus, troyanos y otro malware."},{"c":"tecnologia","d":"facil","q":"¿Qué tecla borra normalmente el carácter que está a la izquierda del cursor?","a":["Retroceso","Supr","Intro","Tabulador"],"e":"La tecla Supr borra el carácter de la derecha."},{"c":"tecnologia","d":"facil","q":"¿Qué es el WiFi?","a":["Una conexión inalámbrica a una red","Un tipo de cable","Un antivirus","Un tipo de disco duro"],"e":"Usa ondas de radio para conectar dispositivos sin cables."},{"c":"tecnologia","d":"facil","q":"¿Qué atajo copia el texto seleccionado en Windows?","a":["Ctrl + C","Ctrl + V","Ctrl + X","Ctrl + Z"],"e":"Ctrl + V pega, Ctrl + X corta y Ctrl + Z deshace."},{"c":"tecnologia","d":"facil","q":"¿Qué es un navegador web?","a":["Un programa para ver páginas web","Un cable de red","Un buscador de archivos del disco","Un tipo de virus"],"e":"Chrome, Firefox o Safari son navegadores. Google es un buscador, que es otra cosa."},{"c":"tecnologia","d":"medio","q":"¿Quién creó la World Wide Web?","a":["Tim Berners-Lee","Bill Gates","Steve Jobs","Linus Torvalds"],"e":"La creó en el CERN (Suiza) s de Santa María."},{"c":"historia","d":"dificil","q":"¿En qué año se proclamó la Segunda República española?","a":["1931","1923","1936","1873"],"e":"Fue el 14 de abril de 1931, tras unas elecciones municipales. La Primera República fue en 1873."},{"c":"historia","d":"dificil","q":"¿Qué tratado de 1494 repartió las tierras por descubrir entre Castilla y Portugal?","a":["Tratado de Tordesillas","Tratado de Utrecht","Paz de Westfalia","Tratado de Versalles"],"e":"Trazó una línea de norte a sur en el Atlántico. Por eso en Brasil se habla portugués."},{"c":"historia","d":"dificil","q":"¿De qué faraón era la tumba casi intacta que encontró Howard Carter en 1922?","a":["Tutankamón","Ramsés II","Keops","Akenatón"],"e":"Tutankamón fue un faraón poco importante, pero su tumba conservaba casi todos sus tesoros."},{"c":"historia","d":"dificil","q":"¿Cuál fue la capital del Imperio bizantino?","a":["Constantinopla","Roma","Atenas","Alejandría"],"e":"Hoy se llama Estambul. Cayó en manos de los otomanos en 1453."},{"c":"historia","d":"dificil","q":"¿Qué tratado de 1713 cedió Gibraltar a Gran Bretaña?","a":["Tratado de Utrecht","Tratado de Tordesillas","Paz de los Pirineos","Tratado de París"],"e":"Puso fin a la guerra de Sucesión española."},{"c":"geografia","d":"facil","q":"¿Cuál es el río más largo de la península ibérica?","a":["Tajo","Ebro","Duero","Guadalquivir"],"e":"Mide unos 1.000 km y desemboca en Lisboa. El Ebro es el más caudaloso."},{"c":"geografia","d":"facil","q":"¿Cuál es la capital de Francia?","a":["París","Lyon","Marsella","Burdeos"],"e":"París es también la ciudad más poblada del país."},{"c":"geografia","d":"facil","q":"¿Cuál es el océano más grande?","a":["Pacífico","Atlántico","Índico","Ártico"],"e":"Ocupa casi un tercio de la superficie de la Tierra."},{"c":"geografia","d":"facil","q":"¿En qué continente está Egipto?","a":["África","Asia","Europa","Oceanía"],"e":"Está en el noreste de África. La península del Sinaí sí está en Asia."},{"c":"geografia","d":"facil","q":"¿Cuál es el país más grande del mundo?","a":["Rusia","Canadá","China","Estados Unidos"],"e":"Rusia tiene más de 17 millones de km² y 11 husos horarios."},{"c":"geografia","d":"facil","q":"¿Cuál es la capital de Portugal?","a":["Lisboa","Oporto","Coímbra","Faro"],"e":"Lisboa está en la desembocadura del Tajo."},{"c":"geografia","d":"facil","q":"¿Cuál es la montaña más alta del mundo?","a":["Everest","K2","Aconcagua","Kilimanjaro"],"e":"Mide unos 8.849 m y está entre Nepal y China."},{"c":"geografia","d":"facil","q":"¿Cuántas comunidades autónomas tiene España?","a":["17","15","19","20"],"e":"Además, Ceuta y Melilla son ciudades autónomas."},{"c":"geografia","d":"facil","q":"¿Qué río pasa por Sevilla?","a":["Guadalquivir","Ebro","Tajo","Guadiana"],"e":"Su nombre viene del árabe \"al-wadi al-kabir\", el río grande."},{"c":"geografia","d":"medio","q":"¿Cuál es la capital de Australia?","a":["Canberra","Sídney","Melbourne","Perth"],"e":"Se construyó como capital para evitar la rivalidad entre Sídney y Melbourne."},{"c":"geografia","d":"medio","q":"¿Cuál es el mayor desierto cálido del mundo?","a":["Sáhara","Gobi","Atacama","Kalahari"],"e":"Si se cuentan los desiertos fríos, el mayor es la Antártida."},{"c":"geografia","d":"medio","q":"¿Cuál es el río más largo de Europa?","a":["Volga","Danubio","Rin","Tajo"],"e":"Mide unos 3.500 km, atraviesa Rusia y desemboca en el mar Caspio."},{"c":"geografia","d":"medio","q":"¿Qué país tiene forma de bota?","a":["Italia","Grecia","Portugal","Croacia"],"e":"La \"punta\" de la bota es Calabria y el \"balón\" de delante es Sicilia."},{"c":"geografia","d":"medio","q":"¿Cuál es la capital de Canadá?","a":["Ottawa","Toronto","Montreal","Vancouver"],"e":"Toronto es la ciudad más grande, pero la capital es Ottawa."},{"c":"geografia","d":"medio","q":"¿Qué estrecho separa España de Marruecos?","a":["Estrecho de Gibraltar","Estrecho de Magallanes","Bósforo","Estrecho de Ormuz"],"e":"En su punto más estrecho mide unos 14 km."},{"c":"geografia","d":"medio","q":"¿Cuál es el lago más grande de África?","a":["Lago Victoria","Lago Tanganica","Lago Chad","Lago Malaui"],"e":"Lo comparten Uganda, Kenia y Tanzania. En él nace el Nilo Blanco."},{"c":"geografia","d":"medio","q":"¿Cuál es el pico más alto de la península ibérica?","a":["Mulhacén","Aneto","Teide","Veleta"],"e":"Mide 3.479 m. El Teide es más alto, pero está en Tenerife."},{"c":"geografia","d":"medio","q":"¿Qué país es el más poblado del mundo desde 2023, según la ONU?","a":["India","China","Estados Unidos","Indonesia"],"e":"India superó a China en 2023, con más de 1.400 millones de habitantes."},{"c":"geografia","d":"dificil","q":"¿Cuál es la capital de Kazajistán?","a":["Astaná","Almaty","Taskent","Biskek"],"e":"Almaty fue la capital hasta 1997. Taskent es la de Uzbekistán y Biskek, la de Kirguistán."},{"c":"geografia","d":"dificil","q":"¿Cuál de estos países no tiene salida al mar?","a":["Bolivia","Chile","Perú","Ecuador"],"e":"Bolivia perdió su costa en la guerra del Pacífico (1879-1884)."},{"c":"geografia","d":"dificil","q":"¿Qué río marca parte de la frontera entre México y Estados Unidos?","a":["Río Bravo (Río Grande)","Misisipi","Colorado","Amazonas"],"e":"En México se llama río Bravo y en Estados Unidos, Río Grande."},{"c":"geografia","d":"dificil","q":"¿Cuál es la isla más grande del mundo, sin contar Australia?","a":["Groenlandia","Madagascar","Borneo","Nueva Guinea"],"e":"Tiene unos 2,1 millones de km² y está casi cubierta de hielo."},{"c":"geografia","d":"dificil","q":"¿Qué cordillera marca la frontera clásica entre Europa y Asia?","a":["Los Urales","Los Alpes","Los Pirineos","Los Cárpatos"],"e":"Recorren Rusia de norte a sur durante unos 2.500 km."},{"c":"geografia","d":"dificil","q":"¿Cuál es la capital de Nueva Zelanda?","a":["Wellington","Auckland","Christchurch","Queenstown"],"e":"Auckland es la ciudad más poblada, pero la capital es Wellington."},{"c":"geografia","d":"dificil","q":"¿Con cuántos territorios tiene frontera terrestre España?","a":["5","3","4","6"],"e":"Francia, Portugal, Andorra, Marruecos (en Ceuta y Melilla) y Gibraltar (Reino Unido)."},{"c":"matematicas","d":"facil","q":"¿Cuánto es 7 × 8?","a":["56","54","48","64"],"e":"7 × 8 = 56. Truco: 5, 6, 7, 8 → 56 = 7 × 8."},{"c":"matematicas","d":"facil","q":"¿Cuántos lados tiene un hexágono?","a":["6","5","7","8"],"e":"\"Hexa\" significa seis en griego. Las celdas de los panales son hexágonos."},{"c":"matematicas","d":"facil","q":"¿Cuánto es el 50 % de 80?","a":["40","30","50","20"],"e":"El 50 % es la mitad: 80 / 2 = 40."},{"c":"matematicas","d":"facil","q":"¿Cuánto suman los ángulos de un triángulo?","a":["180°","90°","360°","270°"],"e":"Siempre suman 180°, sea cual sea la forma del triángulo (en un plano)."},{"c":"matematicas","d":"facil","q":"¿Cuál es la raíz cuadrada de 81?","a":["9","8","7","18"],"e":"9 × 9 = 81."},{"c":"matematicas","d":"facil","q":"¿Cuánto es 15 + 27?","a":["42","32","43","52"],"e":"15 + 27 = 42."},{"c":"matematicas","d":"facil","q":"¿Cómo se llama un ángulo de 90°?","a":["Recto","Agudo","Obtuso","Llano"],"e":"Agudo mide menos de 90°, obtuso más de 90° y llano 180°."},{"c":"matematicas","d":"facil","q":"¿Qué número es X en números romanos?","a":["10","5","50","100"],"e":"V = 5, X = 10, L = 50, C = 100."},{"c":"matematicas","d":"facil","q":"¿Cuántos minutos hay en 3 horas?","a":["180","120","300","150"],"e":"3 × 60 = 180."},{"c":"matematicas","d":"medio","q":"¿Cuánto es 2 elevado a 10?","a":["1.024","1.000","512","2.048"],"e":"Por eso 1 KB \"binario\" son 1.024 bytes."},{"c":"matematicas","d":"medio","q":"¿Cuál es el área de un rectángulo de 6 cm por 4 cm?","a":["24 cm²","20 cm²","10 cm²","48 cm²"],"e":"Área = base × altura = 6 × 4 = 24 cm². 20 cm sería el perímetro."},{"c":"matematicas","d":"medio","q":"¿Qué número sigue en la serie 1, 1, 2, 3, 5, 8...?","a":["13","11","12","16"],"e":"Es la sucesión de Fibonacci: cada número es la suma de los dos anteriores (5 + 8 = 13)."},{"c":"matematicas","d":"medio","q":"¿Qué dice el teorema de Pitágoras?","a":["a² + b² = c² en un triángulo rectángulo","Los ángulos de un triángulo suman 180°","El área de un círculo es πr²","a + b = c en cualquier triángulo"],"e":"La suma de los cuadrados de los catetos es igual al cuadrado de la hipotenusa."},{"c":"matematicas","d":"medio","q":"¿Cuánto es 3/4 en número decimal?","a":["0,75","0,34","0,7","1,33"],"e":"3 / 4 = 0,75."},{"c":"matematicas","d":"medio","q":"¿Cuál es el mínimo común múltiplo de 4 y 6?","a":["12","24","2","10"],"e":"Es el menor número que es múltiplo de los dos: 12. El 2 es el máximo común divisor."},{"c":"matematicas","d":"medio","q":"Si x + 5 = 12, ¿cuánto vale x?","a":["7","17","5","12"],"e":"Se resta 5 a los dos lados: x = 12 − 5 = 7."},{"c":"matematicas","d":"medio","q":"¿Cuántas caras tiene un cubo?","a":["6","8","12","4"],"e":"Tiene 6 caras, 8 vértices y 12 aristas."},{"c":"matematicas","d":"medio","q":"¿Qué número es MCM en números romanos?","a":["1900","2100","1500","1100"],"e":"M = 1000 y CM = 900 (C delante de M resta 100)."},{"c":"matematicas","d":"dificil","q":"¿Cuántos números primos hay entre 1 y 20?","a":["8","6","7","9"],"e":"Son 2, 3, 5, 7, 11, 13, 17 y 19."},{"c":"matematicas","d":"dificil","q":"¿Cuál es el área aproximada de un círculo de radio 3 (con π ≈ 3,14)?","a":["28,26","18,84","9,42","113,04"],"e":"A = π × r² = 3,14 × 9 = 28,26. 18,84 sería la longitud de la circunferencia."},{"c":"matematicas","d":"dificil","q":"¿Cuánto vale 0! (cero factorial)?","a":["1","0","No existe","Infinito"],"e":"Se define así para que las fórmulas de combinatoria funcionen."},{"c":"matematicas","d":"dificil","q":"¿Qué probabilidad hay de sacar dos seises al tirar dos dados?","a":["1/36","1/6","1/12","2/6"],"e":"Cada dado tiene 1/6 de sacar un seis: 1/6 × 1/6 = 1/36."},{"c":"matematicas","d":"dificil","q":"¿Cuántas diagonales tiene un pentágono?","a":["5","10","3","4"],"e":"Fórmula: n × (n − 3) / 2 = 5 × 2 / 2 = 5."},{"c":"matematicas","d":"dificil","q":"¿Cuánto es el logaritmo en base 10 de 1.000?","a":["3","10","100","30"],"e":"10³ = 1.000, así que log₁₀(1.000) = 3."},{"c":"matematicas","d":"dificil","q":"¿De cuántas formas distintas se pueden ordenar 4 libros en una estantería?","a":["24","16","12","4"],"e":"Son permutaciones: 4! = 4 × 3 × 2 × 1 = 24."},{"c":"fisica","d":"facil","q":"¿Qué instrumento mide la temperatura?","a":["Termómetro","Barómetro","Anemómetro","Higrómetro"],"e":"El barómetro mide la presión, el anemómetro el viento y el higrómetro la humedad."},{"c":"fisica","d":"facil","q":"¿En qué unidad se mide la fuerza en el Sistema Internacional?","a":["Newton","Julio","Vatio","Pascal"],"e":"Se llama así por Isaac Newton. El julio mide energía y el vatio, potencia."},{"c":"fisica","d":"facil","q":"¿Qué viaja más rápido?","a":["La luz","El sonido","Un avión supersónico","Un cohete"],"e":"La luz viaja a casi 300.000 km por segundo; el sonido en el aire, a unos 343 m/s."},{"c":"fisica","d":"facil","q":"¿Qué tipo de imán atrae objetos de hierro?","a":["Cualquier imán","Solo los imanes de colores","Solo los imanes calientes","Ninguno"],"e":"El hierro es un material ferromagnético: todos los imanes lo atraen."},{"c":"fisica","d":"facil","q":"¿Qué se forma cuando la luz del sol atraviesa gotas de lluvia?","a":["Un arcoíris","Un eclipse","Una aurora","Un rayo"],"e":"Las gotas separan la luz blanca en sus colores, como un prisma."},{"c":"fisica","d":"facil","q":"¿Qué palanca de casa es un ejemplo de máquina simple?","a":["Unas tijeras","Una bombilla","Un enchufe","Un espejo"],"e":"Las tijeras son dos palancas unidas por un punto de apoyo."},{"c":"fisica","d":"facil","q":"¿Qué ocurre con la mayoría de los materiales al calentarlos?","a":["Se dilatan","Se encogen","Desaparecen","Se vuelven magnéticos"],"e":"El calor hace que sus partículas se muevan más y ocupen más espacio."},{"c":"fisica","d":"facil","q":"¿Por qué flota un barco de hierro?","a":["Porque desaloja mucha agua","Porque el hierro pesa poco","Porque el agua salada es magnética","Porque tiene motor"],"e":"Según Arquímedes, recibe un empuje igual al peso del agua que desaloja."},{"c":"fisica","d":"facil","q":"¿Qué necesita el sonido para propagarse?","a":["Un medio, como el aire o el agua","El vacío","La luz","Electricidad"],"e":"En el espacio, que es casi vacío, no se oye nada."},{"c":"fisica","d":"medio","q":"¿Quién formuló la ley de la gravitación universal?","a":["Isaac Newton","Galileo Galilei","Albert Einstein","Johannes Kepler"],"e":"La publicó en 1687 en su obra \"Principia\"."},{"c":"fisica","d":"medio","q":"¿Qué dice la ley de Ohm?","a":["V = I × R","E = m × c²","F = m × a","P = F / S"],"e":"El voltaje es igual a la intensidad por la resistencia."},{"c":"fisica","d":"medio","q":"¿Qué científico propuso la teoría de la relatividad?","a":["Albert Einstein","Isaac Newton","Niels Bohr","Max Planck"],"e":"La especial es de 1905 y la general, de 1915."},{"c":"fisica","d":"medio","q":"¿A qué velocidad aproximada viaja el sonido en el aire?","a":["343 m/s","34 m/s","3.430 m/s","300.000 km/s"],"e":"Depende de la temperatura; a 20 °C es de unos 343 m/s."},{"c":"fisica","d":"medio","q":"¿Qué es el cero absoluto?","a":["La temperatura más baja posible","El punto de congelación del agua","La temperatura del espacio exterior","La temperatura del núcleo de la Tierra"],"e":"Equivale a 0 K o −273,15 °C. Ahí las partículas tienen la mínima energía posible."},{"c":"fisica","d":"medio","q":"¿Cuál es la fórmula de la velocidad media?","a":["Distancia / tiempo","Tiempo / distancia","Masa × aceleración","Distancia × tiempo"],"e":"Si recorres 100 km en 2 horas, vas a 50 km/h de media."},{"c":"fisica","d":"medio","q":"¿Qué tipo de corriente llega a los enchufes de casa?","a":["Alterna","Continua","Estática","Magnética"],"e":"En España es corriente alterna de 230 V y 50 Hz."},{"c":"fisica","d":"medio","q":"¿Qué fenómeno hace que una pajita parezca rota dentro de un vaso de agua?","a":["La refracción","La reflexión","La difracción","La absorción"],"e":"La luz cambia de dirección al pasar del agua al aire."},{"c":"fisica","d":"medio","q":"¿Qué color de luz tiene la longitud de onda más larga del espectro visible?","a":["Rojo","Violeta","Azul","Verde"],"e":"Por eso más allá del rojo está el infrarrojo y más allá del violeta, el ultravioleta."},{"c":"fisica","d":"dificil","q":"¿Qué científico explicó el efecto fotoeléctrico y ganó el Nobel por ello?","a":["Albert Einstein","Max Planck","Heinrich Hertz","Niels Bohr"],"e":"Einstein ganó el Nobel de 1921 por el efecto fotoeléctrico, no por la relatividad."},{"c":"fisica","d":"dificil","q":"¿Qué dice la segunda ley de Newton?","a":["F = m × a","Todo cuerpo sigue en reposo si no actúa una fuerza","A toda acción le sigue una reacción igual y contraria","E = m × c²"],"e":"La fuerza es igual a la masa por la aceleración."},{"c":"fisica","d":"dificil","q":"¿A qué temperatura coinciden las escalas Celsius y Fahrenheit?","a":["−40 grados","0 grados","100 grados","−273 grados"],"e":"−40 °C son exactamente −40 °F."},{"c":"fisica","d":"dificil","q":"¿Qué partícula transmite la fuerza electromagnética?","a":["El fotón","El gluón","El electrón","El neutrino"],"e":"El gluón transmite la fuerza nuclear fuerte."},{"c":"fisica","d":"dificil","q":"¿Cuál es la aceleración de la gravedad en la superficie de la Tierra?","a":["9,8 m/s²","1,6 m/s²","98 m/s²","3,7 m/s²"],"e":"1,6 m/s² es la de la Luna y 3,7 m/s², la de Marte."},{"c":"fisica","d":"dificil","q":"¿Qué principio impide que dos electrones de un átomo tengan los mismos números cuánticos?","a":["Principio de exclusión de Pauli","Principio de incertidumbre","Principio de Arquímedes","Principio de Pascal"],"e":"Por eso los electrones se reparten en distintos orbitales."},{"c":"fisica","d":"dificil","q":"¿Qué famoso experimento mental usa un gato que está \"vivo y muerto a la vez\"?","a":["El gato de Schrödinger","El demonio de Maxwell","La paradoja de los gemelos","El experimento de Michelson-Morley"],"e":"Schrödinger lo planteó en 1935 para mostrar lo raro de la mecánica cuántica."},{"c":"quimica","d":"facil","q":"¿Cuál es la fórmula del agua?","a":["H₂O","CO₂","O₂","NaCl"],"e":"Dos átomos de hidrógeno y uno de oxígeno."},{"c":"quimica","d":"facil","q":"¿Qué gas forma la mayor parte del aire?","a":["Nitrógeno","Oxígeno","Dióxido de carbono","Argón"],"e":"El aire tiene un 78 % de nitrógeno y un 21 % de oxígeno."},{"c":"quimica","d":"facil","q":"¿Qué es la sal de mesa en química?","a":["Cloruro de sodio","Bicarbonato de sodio","Carbonato de calcio","Sulfato de cobre"],"e":"Su fórmula es NaCl."},{"c":"quimica","d":"facil","q":"¿Cuál es el símbolo químico del oro?","a":["Au","Or","Go","Ag"],"e":"Viene del latín \"aurum\". Ag es la plata (\"argentum\")."},{"c":"quimica","d":"facil","q":"¿Qué elemento necesitamos respirar?","a":["Oxígeno","Hidrógeno","Helio","Carbono"],"e":"Las células usan el oxígeno para obtener energía."},{"c":"quimica","d":"facil","q":"¿Qué gas usan los globos que suben solos?","a":["Helio","Oxígeno","Dióxido de carbono","Nitrógeno"],"e":"El helio pesa menos que el aire y no arde."},{"c":"quimica","d":"facil","q":"¿Qué metal es líquido a temperatura ambiente?","a":["Mercurio","Hierro","Aluminio","Plata"],"e":"Su símbolo es Hg y se usaba en termómetros antiguos."},{"c":"quimica","d":"facil","q":"¿Qué ocurre cuando el hierro se oxida?","a":["Se forma óxido de hierro (herrumbre)","Se convierte en oro","Se vuelve líquido","Se hace magnético"],"e":"El hierro reacciona con el oxígeno y el agua del aire."},{"c":"quimica","d":"facil","q":"¿Qué científico ordenó los elementos en la tabla periódica en 1869?","a":["Dmitri Mendeléyev","Antoine Lavoisier","John Dalton","Marie Curie"],"e":"Dejó huecos para elementos aún sin descubrir y predijo sus propiedades."},{"c":"quimica","d":"medio","q":"¿Cuál es el símbolo químico del sodio?","a":["Na","So","Sd","S"],"e":"Viene del latín \"natrium\". S es el azufre."},{"c":"quimica","d":"medio","q":"¿Qué número atómico tiene el carbono?","a":["6","12","8","14"],"e":"Tiene 6 protones. 12 es su número másico más común."},{"c":"quimica","d":"medio","q":"¿Qué partícula del átomo tiene carga negativa?","a":["Electrón","Protón","Neutrón","Núcleo"],"e":"El protón es positivo y el neutrón no tiene carga."},{"c":"quimica","d":"medio","q":"¿Qué pH tiene una sustancia ácida?","a":["Menor que 7","Mayor que 7","Exactamente 7","Mayor que 14"],"e":"Cuanto más bajo, más ácida. El zumo de limón tiene un pH de unos 2."},{"c":"quimica","d":"medio","q":"¿Qué elemento es el más abundante del universo?","a":["Hidrógeno","Helio","Oxígeno","Carbono"],"e":"Forma alrededor del 74 % de la materia normal del universo."},{"c":"quimica","d":"medio","q":"¿Qué científico enunció la ley de conservación de la masa?","a":["Antoine Lavoisier","Isaac Newton","Robert Boyle","Amedeo Avogadro"],"e":"\"Nada se pierde, nada se crea, todo se transforma\"."},{"c":"quimica","d":"medio","q":"¿Cuál es el símbolo químico del hierro?","a":["Fe","Hi","Ir","H"],"e":"Viene del latín \"ferrum\". Ir es el iridio."},{"c":"quimica","d":"medio","q":"¿Qué es una mezcla homogénea?","a":["Una mezcla en la que no se distinguen sus componentes","Una mezcla en la que se ven sus componentes","Un elemento puro","Un compuesto químico"],"e":"Ejemplos: el aire o el agua con sal disuelta."},{"c":"quimica","d":"medio","q":"¿Qué gases se llaman \"nobles\" porque casi no reaccionan?","a":["Helio, neón, argón...","Oxígeno, nitrógeno, cloro...","Hidrógeno y carbono","Sodio y potasio"],"e":"Ocupan la última columna de la tabla periódica."},{"c":"quimica","d":"dificil","q":"¿Cuántos elementos tiene la tabla periódica oficial?","a":["118","92","108","150"],"e":"Los últimos cuatro recibieron nombre en 2016: nihonio, moscovio, teneso y oganesón."},{"c":"quimica","d":"dificil","q":"¿Qué científico español aisló por primera vez el wolframio junto a su hermano?","a":["Fausto Elhuyar","Andrés Manuel del Río","Severo Ochoa","Antonio de Ulloa"],"e":"Los hermanos Elhuyar lo lograron en 1783 en el Seminario de Bergara (Gipuzkoa)."},{"c":"quimica","d":"dificil","q":"¿Qué elemento descubrió el español Andrés Manuel del Río en México?","a":["Vanadio","Wolframio","Platino","Cobalto"],"e":"Lo descubrió en 1801, pero no se le reconoció hasta años después."},{"c":"quimica","d":"dificil","q":"¿Cuál es el número de Avogadro aproximado?","a":["6,022 × 10²³","3 × 10⁸","9,8 × 10²","1,6 × 10⁻¹⁹"],"e":"Es el número de partículas que hay en un mol de sustancia."},{"c":"quimica","d":"dificil","q":"¿Qué tipo de enlace une los átomos en la sal (NaCl)?","a":["Iónico","Covalente","Metálico","Puente de hidrógeno"],"e":"El sodio cede un electrón al cloro y se atraen por tener cargas opuestas."},{"c":"quimica","d":"dificil","q":"¿Qué gas se libera al mezclar vinagre y bicarbonato?","a":["Dióxido de carbono","Oxígeno","Hidrógeno","Cloro"],"e":"Por eso aparecen burbujas: es la reacción del ácido acético con el bicarbonato."},{"c":"quimica","d":"dificil","q":"¿Qué metal es el mejor conductor de la electricidad?","a":["Plata","Cobre","Oro","Aluminio"],"e":"Se usa más el cobre porque es mucho más barato."},{"c":"biologia","d":"facil","q":"¿Cuántos huesos tiene un adulto?","a":["206","150","300","180"],"e":"Al nacer tenemos unos 300, pero muchos se fusionan al crecer."},{"c":"biologia","d":"facil","q":"¿Cuál es el órgano más grande del cuerpo humano?","a":["La piel","El hígado","El intestino","El cerebro"],"e":"En un adulto ocupa unos 2 m² y pesa varios kilos."},{"c":"biologia","d":"facil","q":"¿Qué animal es el más grande que ha existido?","a":["La ballena azul","El elefante africano","El tiburón ballena","El diplodocus"],"e":"Puede medir unos 30 m y pesar más de 150 toneladas."},{"c":"biologia","d":"facil","q":"¿Cuántas patas tiene un insecto?","a":["6","8","4","10"],"e":"Las arañas tienen 8 y no son insectos, sino arácnidos."},{"c":"biologia","d":"facil","q":"¿Qué órgano usamos para respirar?","a":["Los pulmones","El estómago","El hígado","Los riñones"],"e":"En ellos el oxígeno pasa a la sangre."},{"c":"biologia","d":"facil","q":"¿De qué se alimenta un animal herbívoro?","a":["De plantas","De carne","De insectos","De todo"],"e":"Ejemplos: la vaca, el conejo o el caballo."},{"c":"biologia","d":"facil","q":"¿Qué animal pone huevos siendo mamífero?","a":["Ornitorrinco","Murciélago","Delfín","Canguro"],"e":"El ornitorrinco y los equidnas son los únicos mamíferos que ponen huevos."},{"c":"biologia","d":"facil","q":"¿Qué transporta la sangre a todas las células?","a":["Oxígeno y nutrientes","Solo agua","Solo aire","Huesos"],"e":"Los glóbulos rojos llevan el oxígeno; el plasma, los nutrientes."},{"c":"biologia","d":"facil","q":"¿Cómo se llama la cría de la rana?","a":["Renacuajo","Larva de mosca","Pollito","Oruga"],"e":"El renacuajo vive en el agua y respira por branquias hasta que se transforma."},{"c":"biologia","d":"medio","q":"¿Qué molécula guarda la información genética?","a":["El ADN","La glucosa","El colesterol","La hemoglobina"],"e":"Tiene forma de doble hélice y está en el núcleo de las células."},{"c":"biologia","d":"medio","q":"¿Cómo se llama el proceso por el que una oruga se convierte en mariposa?","a":["Metamorfosis","Fotosíntesis","Mitosis","Hibernación"],"e":"Pasa por huevo, larva (oruga), pupa (crisálida) y adulto."},{"c":"biologia","d":"medio","q":"¿Qué pigmento da el color verde a las plantas?","a":["Clorofila","Melanina","Hemoglobina","Caroteno"],"e":"Capta la luz del sol para la fotosíntesis."},{"c":"biologia","d":"medio","q":"¿Cuántas cavidades tiene el corazón humano?","a":["4","2","3","6"],"e":"Dos aurículas y dos ventrículos."},{"c":"biologia","d":"medio","q":"¿Qué células defienden el cuerpo de las infecciones?","a":["Glóbulos blancos","Glóbulos rojos","Plaquetas","Neuronas"],"e":"También se llaman leucocitos."},{"c":"biologia","d":"medio","q":"¿Qué animal tiene el cuello más largo?","a":["Jirafa","Avestruz","Llama","Cisne"],"e":"Su cuello tiene solo 7 vértebras, como el nuestro, pero muy largas."},{"c":"biologia","d":"medio","q":"¿Qué tipo de animal es la ballena?","a":["Mamífero","Pez","Anfibio","Reptil"],"e":"Respira aire con pulmones y amamanta a sus crías."},{"c":"biologia","d":"medio","q":"¿Qué parte del ojo controla cuánta luz entra?","a":["La pupila (gracias al iris)","La córnea","La retina","El cristalino"],"e":"El iris abre o cierra la pupila según la luz."},{"c":"biologia","d":"medio","q":"¿Qué glándula produce la insulina?","a":["El páncreas","El tiroides","El hígado","La hipófisis"],"e":"La insulina regula el azúcar en sangre. Si falla, aparece la diabetes."},{"c":"biologia","d":"dificil","q":"¿Qué proceso de división celular produce óvulos y espermatozoides?","a":["Meiosis","Mitosis","Fisión binaria","Gemación"],"e":"La meiosis reduce los cromosomas a la mitad."},{"c":"biologia","d":"dificil","q":"¿Qué científico español descubrió la estructura de las neuronas?","a":["Santiago Ramón y Cajal","Severo Ochoa","Miguel Servet","Gregorio Marañón"],"e":"Ganó el Nobel en 1906 y es el padre de la neurociencia moderna."},{"c":"biologia","d":"dificil","q":"¿Qué científico español describió la circulación pulmonar de la sangre en el siglo XVI?","a":["Miguel Servet","Ramón y Cajal","Andrés Vesalio","Severo Ochoa"],"e":"La describió en 1553. Vesalio era flamenco."},{"c":"biologia","d":"dificil","q":"¿Qué bases forman el ADN?","a":["Adenina, timina, citosina y guanina","Adenina, uracilo, citosina y guanina","Glucosa, fructosa, lactosa y sacarosa","Hierro, calcio, sodio y potasio"],"e":"El uracilo sustituye a la timina en el ARN."},{"c":"biologia","d":"dificil","q":"¿Cuál es la clasificación correcta de los seres vivos, de mayor a menor?","a":["Reino, filo, clase, orden, familia, género, especie","Especie, género, familia, orden, clase, filo, reino","Reino, clase, filo, familia, orden, especie, género","Filo, reino, orden, clase, género, familia, especie"],"e":"La propuso Linneo en el siglo XVIII (con algunos cambios posteriores)."},{"c":"biologia","d":"dificil","q":"¿Qué orgánulo hace la fotosíntesis en las células vegetales?","a":["El cloroplasto","La mitocondria","La vacuola","El ribosoma"],"e":"Los cloroplastos contienen clorofila."},{"c":"biologia","d":"dificil","q":"¿Qué animal tiene tres corazones?","a":["El pulpo","El tiburón","La medusa","La lombriz"],"e":"Dos bombean sangre a las branquias y uno al resto del cuerpo. Su sangre es azul."},{"c":"astronomia","d":"facil","q":"¿Cuál es el planeta más cercano al Sol?","a":["Mercurio","Venus","Marte","La Tierra"],"e":"Una vuelta al Sol le dura solo 88 días."},{"c":"astronomia","d":"facil","q":"¿Cuál es el planeta más grande del sistema solar?","a":["Júpiter","Saturno","Neptuno","La Tierra"],"e":"En él cabrían más de 1.300 Tierras."},{"c":"astronomia","d":"facil","q":"¿Cuántos planetas tiene el sistema solar?","a":["8","9","7","10"],"e":"Plutón dejó de considerarse planeta en 2006 y pasó a ser planeta enano."},{"c":"astronomia","d":"facil","q":"¿Qué planeta se conoce como el \"planeta rojo\"?","a":["Marte","Venus","Júpiter","Mercurio"],"e":"El color se debe al óxido de hierro de su suelo."},{"c":"astronomia","d":"facil","q":"¿Quién fue la primera persona en pisar la Luna?","a":["Neil Armstrong","Yuri Gagarin","Buzz Aldrin","Michael Collins"],"e":"Lo hizo el 20 de julio de 1969. Gagarin fue el primero en ir al espacio."},{"c":"astronomia","d":"facil","q":"¿Qué es el Sol?","a":["Una estrella","Un planeta","Un satélite","Un cometa"],"e":"Es una estrella mediana, de tipo enana amarilla."},{"c":"astronomia","d":"facil","q":"¿Cuánto tarda la Tierra en dar una vuelta alrededor del Sol?","a":["Un año","Un día","Un mes","Una semana"],"e":"Unos 365,25 días; por eso cada 4 años hay un año bisiesto."},{"c":"astronomia","d":"facil","q":"¿Qué planeta tiene unos anillos muy visibles?","a":["Saturno","Marte","Mercurio","Venus"],"e":"Júpiter, Urano y Neptuno también tienen anillos, pero mucho más débiles."},{"c":"astronomia","d":"facil","q":"¿Cómo se llama nuestra galaxia?","a":["La Vía Láctea","Andrómeda","Orión","La Osa Mayor"],"e":"Tiene entre 100.000 y 400.000 millones de estrellas."},{"c":"astronomia","d":"medio","q":"¿Cuánto tarda la luz del Sol en llegar a la Tierra?","a":["Unos 8 minutos","1 segundo","1 hora","1 día"],"e":"Recorre unos 150 millones de kilómetros."},{"c":"astronomia","d":"medio","q":"¿Qué planeta es el más caliente del sistema solar?","a":["Venus","Mercurio","Marte","Júpiter"],"e":"Su atmósfera de CO₂ atrapa el calor: llega a unos 460 °C."},{"c":"astronomia","d":"medio","q":"¿Quién fue la primera mujer en viajar al espacio?","a":["Valentina Tereshkova","Sally Ride","Mae Jemison","Svetlana Savitskaya"],"e":"Fue en 1963, a bordo de la Vostok 6."},{"c":"astronomia","d":"medio","q":"¿Qué es un año luz?","a":["Una distancia","Un tiempo","Una velocidad","Un tipo de estrella"],"e":"Es la distancia que recorre la luz en un año: unos 9,46 billones de km."},{"c":"astronomia","d":"medio","q":"¿Qué planeta gira \"tumbado\", con el eje casi horizontal?","a":["Urano","Neptuno","Saturno","Marte"],"e":"Su eje está inclinado unos 98°. Probablemente por un gran choque."},{"c":"astronomia","d":"medio","q":"¿Cuál es la galaxia grande más cercana a la Vía Láctea?","a":["Andrómeda","La Nube de Magallanes","El Triángulo","Sombrero"],"e":"Está a unos 2,5 millones de años luz y algún día chocará con la nuestra."},{"c":"astronomia","d":"medio","q":"¿Qué científico defendió que la Tierra gira alrededor del Sol en 1543?","a":["Nicolás Copérnico","Ptolomeo","Aristóteles","Isaac Newton"],"e":"Es el modelo heliocéntrico. Ptolomeo defendía que la Tierra era el centro."},{"c":"astronomia","d":"medio","q":"¿Por qué hay estaciones en la Tierra?","a":["Por la inclinación del eje de la Tierra","Por la distancia al Sol","Por la rotación de la Luna","Por las mareas"],"e":"El eje está inclinado unos 23,5°. En enero la Tierra está más cerca del Sol que en julio."},{"c":"astronomia","d":"medio","q":"¿Qué fue el Sputnik 1?","a":["El primer satélite artificial","El primer cohete con personas","La primera estación espacial","El primer telescopio espacial"],"e":"Lo lanzó la URSS en 1957."},{"c":"astronomia","d":"dificil","q":"¿Qué planeta tiene el día más largo que su año?","a":["Venus","Mercurio","Marte","Neptuno"],"e":"Tarda unos 243 días en girar sobre sí mismo y unos 225 en dar la vuelta al Sol."},{"c":"astronomia","d":"dificil","q":"¿Qué es una enana blanca?","a":["El resto de una estrella como el Sol al morir","Un planeta enano","Una estrella recién nacida","Un tipo de galaxia"],"e":"Es muy densa: una cucharada pesaría toneladas."},{"c":"astronomia","d":"dificil","q":"¿Cómo se llama la estrella más cercana al sistema solar?","a":["Próxima Centauri","Sirio","Betelgeuse","Estrella Polar"],"e":"Está a unos 4,2 años luz."},{"c":"astronomia","d":"dificil","q":"¿Qué telescopio espacial se lanzó en diciembre de 2021?","a":["James Webb","Hubble","Kepler","Spitzer"],"e":"Observa en infrarrojo y está a 1,5 millones de km de la Tierra."},{"c":"astronomia","d":"dificil","q":"¿Qué sonda es el objeto humano más lejano de la Tierra?","a":["Voyager 1","New Horizons","Pioneer 10","Voyager 2"],"e":"Se lanzó en 1977 y salió del sistema solar al espacio interestelar en 2012."},{"c":"astronomia","d":"dificil","q":"¿Qué es el horizonte de sucesos de un agujero negro?","a":["El límite del que ni la luz puede escapar","El centro del agujero negro","El disco de gas que lo rodea","El chorro de energía que expulsa"],"e":"Lo que lo cruza ya no puede volver a salir."},{"c":"astronomia","d":"dificil","q":"¿Qué astrónomo descubrió las cuatro lunas grandes de Júpiter en 1610?","a":["Galileo Galilei","Johannes Kepler","Tycho Brahe","Edwin Hubble"],"e":"Ío, Europa, Ganímedes y Calisto se llaman \"lunas galileanas\"."},{"c":"naturaleza","d":"facil","q":"¿Cuál es el animal terrestre más rápido?","a":["Guepardo","León","Caballo","Gacela"],"e":"Puede pasar de 0 a 100 km/h en unos 3 segundos."},{"c":"naturaleza","d":"facil","q":"¿Qué hacen muchas aves en otoño?","a":["Migrar a lugar "a":["5","2","10","15"],"e":"Entre 4,5 y 5,5 litros, según su tamaño."},{"c":"curiosidades","d":"dificil","q":"¿Qué es la \"lluvia de sangre\" que a veces se ve en España?","a":["Lluvia con polvo rojizo del Sáhara","Lluvia de meteoritos","Lluvia ácida","Granizo rojo"],"e":"El viento trae polvo del desierto y la lluvia lo arrastra."},{"c":"curiosidades","d":"dificil","q":"¿Qué país tiene más husos horarios contando sus territorios?","a":["Francia","Rusia","Estados Unidos","China"],"e":"Gracias a sus territorios de ultramar, Francia tiene 12 husos horarios."},{"c":"curiosidades","d":"dificil","q":"¿Qué animal puede sobrevivir en el espacio exterior durante días?","a":["El tardígrado","La cucaracha","El escorpión","La hormiga"],"e":"Estos animales microscópicos aguantan frío extremo, radiación y el vacío."},{"c":"curiosidades","d":"dificil","q":"¿Qué palabra española es la más larga del diccionario de la RAE (sin contar formas conjugadas)?","a":["Electroencefalografista","Esternocleidomastoideo","Otorrinolaringólogo","Desoxirribonucleico"],"e":"Tiene 23 letras. Esternocleidomastoideo tiene 22."},{"c":"logica","d":"facil","q":"Si hoy es lunes, ¿qué día será pasado mañana?","a":["Miércoles","Martes","Jueves","Domingo"],"e":"Mañana será martes y pasado mañana, miércoles."},{"c":"logica","d":"facil","q":"¿Qué número sigue en la serie 2, 4, 6, 8...?","a":["10","9","12","16"],"e":"Se suma 2 cada vez."},{"c":"logica","d":"facil","q":"Ana es más alta que Luis y Luis es más alto que Marta. ¿Quién es la más baja?","a":["Marta","Ana","Luis","No se puede saber"],"e":"Ana > Luis > Marta."},{"c":"logica","d":"facil","q":"¿Qué número falta: 5, 10, 15, __, 25?","a":["20","18","22","30"],"e":"Se suma 5 cada vez."},{"c":"logica","d":"facil","q":"Si un tren sale a las 10:00 y el viaje dura 2 horas y media, ¿a qué hora llega?","a":["12:30","12:00","13:00","11:30"],"e":"10:00 + 2:30 = 12:30."},{"c":"logica","d":"facil","q":"¿Cuál es el intruso: perro, gato, vaca, manzana?","a":["Manzana","Perro","Gato","Vaca"],"e":"Es la única que no es un animal."},{"c":"logica","d":"facil","q":"Si tienes 3 manzanas y te comes 1, ¿cuántas te quedan?","a":["2","3","1","4"],"e":"3 − 1 = 2."},{"c":"logica","d":"facil","q":"¿Qué letra sigue: A, C, E, G...?","a":["I","H","J","F"],"e":"Se salta una letra cada vez."},{"c":"logica","d":"facil","q":"Un granjero tiene 10 ovejas y se escapan todas menos 4. ¿Cuántas le quedan?","a":["4","6","10","0"],"e":"\"Todas menos 4\" significa que quedan 4."},{"c":"logica","d":"medio","q":"¿Qué número sigue: 1, 4, 9, 16, 25...?","a":["36","30","35","49"],"e":"Son los cuadrados: 1², 2², 3², 4², 5², 6² = 36."},{"c":"logica","d":"medio","q":"¿Cuántos meses tienen 28 días?","a":["Todos","Uno","Dos","Ninguno"],"e":"Todos los meses tienen al menos 28 días."},{"c":"logica","d":"medio","q":"Si 3 gatos cazan 3 ratones en 3 minutos, ¿cuántos gatos cazan 100 ratones en 100 minutos?","a":["3","100","33","300"],"e":"Cada gato caza un ratón cada 3 minutos; en 100 minutos, los mismos 3 gatos cazan 100."},{"c":"logica","d":"medio","q":"¿Qué número sigue: 1, 1, 2, 3, 5, 8, 13...?","a":["21","18","20","26"],"e":"Cada número es la suma de los dos anteriores (8 + 13 = 21)."},{"c":"logica","d":"medio","q":"Un ladrillo pesa 1 kg más medio ladrillo. ¿Cuánto pesa el ladrillo?","a":["2 kg","1,5 kg","1 kg","3 kg"],"e":"Si medio ladrillo pesa 1 kg, el ladrillo entero pesa 2 kg."},{"c":"logica","d":"medio","q":"Si todos los gatos son mamíferos y Misi es un gato, entonces...","a":["Misi es un mamífero","Todos los mamíferos son gatos","Misi no es un mamífero","No se puede saber"],"e":"Es un silogismo: lo que vale para todos los gatos vale para Misi."},{"c":"logica","d":"medio","q":"¿Qué número sigue: 3, 6, 12, 24...?","a":["48","36","30","42"],"e":"Cada número es el doble del anterior."},{"c":"logica","d":"medio","q":"En una carrera adelantas al segundo. ¿En qué posición vas?","a":["Segundo","Primero","Tercero","Último"],"e":"Ocupas su lugar: el segundo."},{"c":"logica","d":"medio","q":"Un bate y una pelota cuestan 1,10 € en total. El bate cuesta 1 € más que la pelota. ¿Cuánto cuesta la pelota?","a":["0,05 €","0,10 €","0,15 €","1 €"],"e":"Pelota = 0,05 y bate = 1,05; suman 1,10 y el bate cuesta 1 € más."},{"c":"logica","d":"dificil","q":"¿Qué número sigue: 2, 3, 5, 7, 11, 13...?","a":["17","15","16","19"],"e":"Son los números primos ordenados."},{"c":"logica","d":"dificil","q":"Si 5 máquinas hacen 5 piezas en 5 minutos, ¿cuánto tardan 100 máquinas en hacer 100 piezas?","a":["5 minutos","100 minutos","20 minutos","1 minuto"],"e":"Cada máquina hace una pieza en 5 minutos, trabajen las que trabajen."},{"c":"logica","d":"dificil","q":"Un nenúfar duplica su tamaño cada día y tarda 48 días en cubrir el lago. ¿Cuándo cubría la mitad?","a":["El día 47","El día 24","El día 46","El día 12"],"e":"Si al día siguiente se duplica y cubre todo, el día anterior cubría la mitad."},{"c":"logica","d":"dificil","q":"¿Qué número sigue: 1, 11, 21, 1211, 111221...?","a":["312211","112211","1112221","122111"],"e":"Cada término \"lee\" el anterior: 111221 tiene tres 1, dos 2 y un 1 → 312211."},{"c":"logica","d":"dificil","q":"¿Cuántas veces se puede restar 5 de 25?","a":["Una vez","Cinco veces","Cuatro veces","Ninguna"],"e":"Después de la primera resta ya no restas de 25, sino de 20."},{"c":"logica","d":"dificil","q":"Si María tiene el doble de edad que Juan y dentro de 10 años la suma de sus edades será 50, ¿cuántos años tiene Juan?","a":["10","15","20","12"],"e":"Hoy: J + 2J = 50 − 20 = 30, así que J = 10 y María tiene 20."},{"c":"logica","d":"dificil","q":"¿Qué ángulo forman las agujas de un reloj a las 3:00?","a":["90°","180°","45°","60°"],"e":"Cada hora son 30° (360 / 12): 3 × 30 = 90°."},{"c":"lengua","d":"facil","q":"¿Cuántas letras tiene el abecedario español?","a":["27","26","28","29"],"e":"Incluye la ñ. La ch y la ll dejaron de contarse como letras en 2010."},{"c":"lengua","d":"facil","q":"¿Qué tipo de palabra es \"rápidamente\"?","a":["Adverbio","Adjetivo","Verbo","Sustantivo"],"e":"Muchos adverbios de modo terminan en \"-mente\"."},{"c":"lengua","d":"facil","q":"¿Cuál es el plural de \"pez\"?","a":["Peces","Pezes","Pezs","Pez"],"e":"Las palabras que terminan en z forman el plural en -ces."},{"c":"lengua","d":"facil","q":"¿Qué palabra es un sinónimo de \"feliz\"?","a":["Contento","Triste","Enfadado","Cansado"],"e":"Los sinónimos significan lo mismo o casi lo mismo."},{"c":"lengua","d":"facil","q":"¿Qué palabra es un antónimo de \"alto\"?","a":["Bajo","Grande","Largo","Ancho"],"e":"Los antónimos significan lo contrario."},{"c":"lengua","d":"facil","q":"¿Qué signo abre una pregunta en español?","a":["¿","?","¡","\""],"e":"El español abre y cierra las preguntas: ¿...?"},{"c":"lengua","d":"facil","q":"¿Cuál de estas palabras es un verbo?","a":["Correr","Mesa","Azul","Rápido"],"e":"Los verbos expresan acciones, estados o procesos."},{"c":"lengua","d":"facil","q":"¿Cuántas sílabas tiene \"mariposa\"?","a":["4","3","5","2"],"e":"Ma-ri-po-sa."},{"c":"lengua","d":"facil","q":"¿Qué palabra lleva tilde?","a":["Árbol","Mesa","Casa","Perro"],"e":"Es llana y no termina en n, s ni vocal, así que lleva tilde."},{"c":"lengua","d":"medio","q":"¿Qué tipo de palabra es \"ventana\" según su acentuación?","a":["Llana","Aguda","Esdrújula","Sobresdrújula"],"e":"La sílaba fuerte es la penúltima: ven-TA-na."},{"c":"lengua","d":"medio","q":"¿Cuál de estas palabras es esdrújula?","a":["Música","Canción","Lápiz","Reloj"],"e":"Mú-si-ca: la sílaba fuerte es la antepenúltima. Las esdrújulas siempre llevan tilde."},{"c":"lengua","d":"medio","q":"¿Qué figura literaria es \"tus ojos son dos luceros\"?","a":["Metáfora","Hipérbole","Personificación","Onomatopeya"],"e":"Identifica los ojos con luceros sin usar \"como\"."},{"c":"lengua","d":"medio","q":"¿Qué es una onomatopeya?","a":["Una palabra que imita un sonido","Una exageración","Una comparación","Un nombre propio"],"e":"Ejemplos: guau, miau, tictac, pum."},{"c":"lengua","d":"medio","q":"¿Cuál es el sujeto en \"El perro de Ana ladra mucho\"?","a":["El perro de Ana","Ana","Ladra mucho","Mucho"],"e":"Es quien realiza la acción y concuerda con el verbo."},{"c":"lengua","d":"medio","q":"¿Qué institución publica el diccionario oficial del español?","a":["La Real Academia Española (RAE)","El Instituto Cervantes","La Universidad de Salamanca","El Ministerio de Educación"],"e":"La RAE se fundó en 1713. Trabaja junto a las otras academias de la lengua."},{"c":"lengua","d":"medio","q":"¿Cómo se escribe correctamente?","a":["A ver si vienes","Haber si vienes","Aver si vienes","Haver si vienes"],"e":"Es la preposición \"a\" más el verbo \"ver\". \"Haber\" es otro verbo (haber comido)."},{"c":"lengua","d":"medio","q":"¿Qué palabra está bien escrita?","a":["Hierba","Yerva","Hierva","Hyerba"],"e":"\"Hierba\" (la planta) también se acepta como \"yerba\". \"Hierva\" es del verbo hervir."},{"c":"lengua","d":"medio","q":"¿Qué tiempo verbal es \"habíamos comido\"?","a":["Pretérito pluscuamperfecto","Pretérito perfecto","Futuro perfecto","Condicional compuesto"],"e":"Es una acción pasada anterior a otra también pasada."},{"c":"lengua","d":"dificil","q":"¿En cuántos países soberanos es oficial el español?","a":["20","15","25","18"],"e":"Incluida Guinea Ecuatorial, en África. También es oficial en Puerto Rico, que no es un país independiente."},{"c":"lengua","d":"dificil","q":"¿Qué figura literaria repite una palabra al principio de varios versos?","a":["Anáfora","Aliteración","Epíteto","Hipérbaton"],"e":"Por ejemplo: \"Temprano levantó la muerte el vuelo, / temprano madrugó la madrugada...\" (Miguel Hernández)."},{"c":"lengua","d":"dificil","q":"¿De qué lengua proceden la mayoría de las palabras del español?","a":["Latín","Árabe","Griego","Celta"],"e":"El español es una lengua romance, como el francés o el italiano."},{"c":"lengua","d":"dificil","q":"¿Qué es un arcaísmo?","a":["Una palabra antigua que ya casi no se usa","Una palabra nueva","Una palabra extranjera","Una palabra mal escrita"],"e":"Por ejemplo, \"fermosa\" por \"hermosa\" o \"maguer\" por \"aunque\"."},{"c":"lengua","d":"dificil","q":"¿Qué palabra viene del árabe?","a":["Almohada","Ventana","Mesa","Perro"],"e":"Muchos arabismos empiezan por \"al-\", el artículo árabe."},{"c":"lengua","d":"dificil","q":"¿Qué palabra es correcta según la RAE?","a":["Bizcocho","Bizcoho","Biscocho","Bizcocjo"],"e":"Se escribe con z y ch: biz-co-cho."},{"c":"lengua","d":"dificil","q":"¿Qué es un hiato?","a":["Dos vocales seguidas que van en sílabas distintas","Dos vocales en la misma sílaba","Tres vocales en la misma sílaba","Una sílaba sin vocal"],"e":"Por ejemplo, \"le-ón\" o \"dí-a\". En \"cie-lo\" hay diptongo."},{"c":"arte","d":"facil","q":"¿Quién pintó \"Las Meninas\"?","a":["Diego Velázquez","Francisco de Goya","El Greco","Pablo Picasso"],"e":"La pintó en 1656 y está en el Museo del Prado."},{"c":"arte","d":"facil","q":"¿Quién pintó \"La Gioconda\" (Mona Lisa)?","a":["Leonardo da Vinci","Miguel Ángel","Rafael","Botticelli"],"e":"Está en el Louvre, en París, protegida por un cristal blindado."},{"c":"arte","d":"facil","q":"¿Qué pintor español pintó el \"Guernica\"?","a":["Pablo Picasso","Salvador Dalí","Joan Miró","Joaquín Sorolla"],"e":"Lo pintó en 1937 tras el bombardeo de la villa vizcaína."},{"c":"arte","d":"facil","q":"¿Qué pintor es famoso por sus relojes blandos?","a":["Salvador Dalí","Pablo Picasso","Joan Miró","Vincent van Gogh"],"e":"Aparecen en \"La persistencia de la memoria\" (1931)."},{"c":"arte","d":"facil","q":"¿Qué tres colores son los primarios en pintura tradicional?","a":["Rojo, amarillo y azul","Verde, naranja y morado","Blanco, negro y gris","Rojo, verde y azul"],"e":"Rojo, verde y azul son los primarios de la luz (RGB)."},{"c":"arte","d":"facil","q":"¿Qué arquitecto diseñó la Sagrada Familia?","a":["Antoni Gaudí","Santiago Calatrava","Frank Gehry","Rafael Moneo"],"e":"Gaudí trabajó en ella más de 40 años."},{"c":"arte","d":"facil","q":"¿Qué pintor neerlandés /* ---------- normalización y corrección de respuestas ---------- */
const ARTS = new Set(["el","la","los","las","lo","un","una","unos","unas","the"]);
function norm(t){
  let s = String(t).normalize("NFC").toLowerCase().replace(/\+/g," mas ").replace(/#/g," sharp ").replace(/ñ/g,"\u0001")
    .normalize("NFKD").replace(/[̀-ͯ]/g,"").replace(/\u0001/g,"ñ")
    .replace(/[^a-z0-9ñ ]+/g," ").replace(/\s+/g," ").trim();
  const p = s.split(" ");
  while (p.length > 1 && ARTS.has(p[0])) p.shift();
  return p.join(" ");
}
function singular(s){ return s.split(" ").map(w => w.length>4 && /[^aeiou]es$/.test(w) ? w.slice(0,-2) : (w.length>3 && /s$/.test(w) ? w.slice(0,-1) : w)).join(" "); }
function fon(s){ // misma "pronunciación": b/v, ll/y, h muda, c/z/s, qu/k, g/j...
  return s.replace(/h/g,"").replace(/v/g,"b").replace(/ll/g,"y").replace(/qu/g,"k").replace(/c([ei])/g,"s$1").replace(/z/g,"s")
    .replace(/c/g,"k").replace(/g([ei])/g,"j$1").replace(/x/g,"ks").replace(/w/g,"u").replace(/(.)\1+/g,"$1").replace(/ /g,"");
}
function variantesGenero(s){
  const v = new Set([s]);
  const reglas = [[/esa$/,"es"],[/ora$/,"or"],[/a$/,"o"],[/as$/,"os"]];
  for (const [r,b] of reglas) if (r.test(s)) v.add(s.replace(r,b));
  return [...v];
}
function distancia(a,b){
  if (Math.abs(a.length-b.length) > 3) return 9;
  const d = Array.from({length:a.length+1},(_,i)=>[i]);
  for (let j=1;j<=b.length;j++) d[0][j]=j;
  for (let i=1;i<=a.length;i++) for (let j=1;j<=b.length;j++){
    d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
    if (i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1]) d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1);
  }
  return d[a.length][b.length];
}
const indices = new Map();
function indice(q){
  if (indices.has(q.id)) return indices.get(q.id);
  const exacto = new Map(), fonet = new Map(), formas = [], malas = new Map();
  q.r.forEach((r,i) => [r[0],...r[1]].forEach(f => { const n = norm(f); exacto.set(n,i); exacto.set(singular(n),i); fonet.set(fon(n),i); formas.push([n,i]); }));
  q.x.forEach(x => [x[0],...x[1]].forEach(f => { const n = norm(f); malas.set(n,x); malas.set(singular(n),x); }));
  const ix = {exacto, fonet, formas, malas}; indices.set(q.id, ix); return ix;
}
function juzgar(texto, q){
  const n0 = norm(texto); if (!n0) return {tipo:"vacio"};
  const ix = indice(q);
  const candidatas = q.g ? variantesGenero(n0) : [n0];
  for (const n of candidatas){
    if (ix.exacto.has(n)) return {tipo:"ok", i:ix.exacto.get(n)};
    if (ix.exacto.has(singular(n))) return {tipo:"ok", i:ix.exacto.get(singular(n))};
  }
  if (ix.malas.has(n0) || ix.malas.has(singular(n0))) return {tipo:"mala", x:ix.malas.get(n0) || ix.malas.get(singular(n0))};
  for (const n of candidatas){ const f = fon(n); if (f.length>2 && ix.fonet.has(f)) return {tipo:"ok", i:ix.fonet.get(f), corregida:true}; }
  if (n0.length >= 4){
    let mejor = null, md = 9;
    for (const [f,i] of ix.formas){ const d = distancia(n0,f); if (d<md){md=d;mejor=i;} }
    const tope = n0.length >= 9 ? 2 : 1;
    if (md <= tope) return {tipo:"sugerencia", i:mejor};
  }
  return {tipo:"no"};
}



/* ---------- retos: 7 preguntas abiertas cada uno, mezclando temas ---------- */
function azar(semilla){ return () => { semilla |= 0; semilla = semilla + 0x6D2B79F5 | 0; let t = Math.imul(semilla ^ semilla >>> 15, 1 | semilla); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function barajar(arr, rnd){ const a = arr.slice(); for (let i=a.length-1;i>0;i--){ const j = Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const BASE = ABIERTAS.filter(q => !q.z), BASE_TEST = TEST.filter(q => !q.z);
const RETOS = (() => {
  const ABIERTAS = BASE;
  const resto = barajar(ABIERTAS.map((_,i)=>i), azar(1789)), out = [];
  const n = Math.floor(ABIERTAS.length/7);
  for (let m=0;m<n;m++){
    const el = [], usadas = new Set();
    for (let pas=0; pas<2 && el.length<7; pas++)
      for (let j=0;j<resto.length && el.length<7;j++){
        const q = ABIERTAS[resto[j]]; if (pas===0 && usadas.has(q.c)) continue;
        el.push(resto[j]); usadas.add(q.c); resto.splice(j,1); j--;
      }
    el.sort((a,b)=>DIF[ABIERTAS[a].d]-DIF[ABIERTAS[b].d]);
    out.push(el.map(i=>ABIERTAS[i]));
  }
  return out;
})();

/* retos gamer: solo preguntas de videojuegos */
const RETOS_GAMER = (() => {
  const qs = barajar(ABIERTAS.filter(q => q.c === "videojuegos"), azar(64)), n = Math.floor(qs.length/7), out = Array.from({length:n},()=>[]);
  const ord = ["facil","medio","dificil"].flatMap(d => qs.filter(q => q.d === d)); ord.forEach((q,k) => { if (out[k%n].length < 7) out[k%n].push(q); });
  out.forEach(r => r.sort((a,b)=>DIF[a.d]-DIF[b.d])); return out;
})();
const RETOS_TEST_GAMER = (() => {
  const qs = TEST.filter(q => q.c === "videojuegos"), n = Math.floor(qs.length/10), out = Array.from({length:n},()=>[]);
  const rnd = azar(1985); let k = 0;
  for (const d of ["facil","medio","dificil"]) for (const q of barajar(qs.filter(t=>t.d===d), rnd)){ if (out[k%n].length < 10) out[k%n].push(q); k++; }
  out.forEach(r=>r.sort((a,b)=>DIF[a.d]-DIF[b.d])); return out;
})();
const RETOS_TEST = (() => {
  const TEST = BASE_TEST;
  const n = Math.floor(TEST.length/10), out = Array.from({length:n},()=>[]);
  const rnd = azar(2024); let k = 0;
  for (const d of ["facil","medio","dificil"]) for (const q of barajar(TEST.filter(t=>t.d===d), rnd)){ out[k%n].push(q); k++; }
  out.forEach(r=>r.sort((a,b)=>DIF[a.d]-DIF[b.d]));
  return out;
})();
function hoyISO(){ const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function diaNumero(){ return Math.max(1, Math.round((Date.parse(hoyISO()+"T12:00:00") - Date.parse(DIA_UNO+"T12:00:00"))/864e5)+1); }
function retoDelDia(){ return ((diaNumero()-1) % RETOS.length) + 1; }
function desbloqueado(n, tipo){ if (datos.profe || n===1 || (tipo!=="test" && n===retoDelDia())) return true; const d = tipo==="test" ? datos.estudio : datos.retos; return !!d[n-1]; }
function estrellas(bien, total){ const r = bien/total; return r===1?3:r>=.8?2:r>=.5?1:0; }

function lienzo(w,h){ const c = document.createElement("canvas"); c.width = w; c.height = h; return c; }
function rndS(s){ return () => (s = (s*16807) % 2147483647) / 2147483647; }

/* sprites que se dibujan una sola vez */

  x.fillStyle = g; x.fillRect(0,0,64,64); return c;
}
function spriteNube(){
  const c = lienzo(260,120), x = c.getContext("2d"), r = rndS(7);
  for (let i=0;i<16;i++){ const cx = 40 + r()*180, cy = 50 + r()*35, rr = 22 + r()*30, g = x.createRadialGradient(cx,cy-rr*.3,rr*.1,cx,cy,rr);

}
function spriteNebulosa(){

  for (let i=0;i<26;i++){ const cx = r()*512, cy = r()*1024, rr = 90 + r()*220, col = cols[i%cols.length], g = x.createRadialGradient(cx,cy,0,cx,cy,rr);
    g.addColorStop(0,`rgba(${col},${.10 + r()*.12})`); g.addColorStop(1,`rgba(${col},0)`); x.fillStyle = g; x.fillRect(0,0,512,1024); }

function spriteLuna(){

  x.fillStyle = g; x.fillRect(0,0,S,S);
  for (const [cx,cy,rr] of [[.32,.42,.2],[.62,.3,.13],[.55,.62,.17],[.3,.7,.1]]){ x.fillStyle = "rgba(150,138,104,.45)"; x.beginPath(); x.ellipse(cx*S,cy*S,rr*S,rr*S*.85,r()*3,0,6.3); x.fill(); }
  for (let i=0;i<70;i++){ const cx = r()*S, cy = r()*S, rr = 2 + Math.pow(r(),3)*26;

  const t = x.createRadialGradient(R*1.6,R*1.5,R*.2,R*1.2,R*1.1,R*1.5); t.addColorStop(0,"rgba(10,15,30,.75)"); t.addColorStop(1,"rgba(10,15,30,0)");
  x.fillStyle = t; x.fillRect(0,0,S,S); x.restore(); return c;

function spriteTierra(S){ // disco completo de la Tierra visto de frente
  const c = lienzo(S,S), x = c.getContext("2d"), r = rndS(3), R = S/2;
  x.save(); x.beginPath(); x.arc(R,R,R,0,6.3); x.clip();

    const a = r()*6.3, d = Math.sqrt(r())*rr*S, px = cx*S + Math.cos(a)*d, py = cy*S + Math.sin(a)*d*.8, pr = (.02 + r()*.05)*S;

    for (let i=0;i<60;i++){ const cx = r()*S, cy = r()*S, w = (.05 + r()*.18)*S; x.fillStyle = `rgba(255,255,255,${.25 + r()*.35})`; x.beginPath(); x.ellipse(cx,cy,w,w*.18,r()*.6-.3,0,6.3); x.fill(); }
  const som = x.createRadialGradient(R*.6,R*.5,R*.3,R,R,R*1.05); som.addColorStop(0,"rgba(0,0,0,0)"); som.addColorStop(.8,"rgba(0,10,30,.15)"); som.addColorStop(1,"rgba(0,10,30,.6)");
